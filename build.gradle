plugins {
    id 'java'
    id 'war'
    id 'jacoco'
    id 'checkstyle'
}

group = 'com.moca'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
    springVersion = '5.3.39'
    springSecurityVersion = '5.8.13'
    jacksonVersion = '2.20.2'
    swaggerUiVersion = '5.32.8'
    checkstyleVersion = '12.3.1'
    lombokVersion = '1.18.46'
    testcontainersVersion = '2.0.5'
    flywayVersion = '12.10.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jacoco {
    toolVersion = '0.8.15'
}

checkstyle {
    toolVersion = checkstyleVersion
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

dependencies {
    compileOnly('javax.servlet:javax.servlet-api:4.0.1')
    implementation("org.springframework:spring-webmvc:${springVersion}")
    implementation("org.springframework:spring-jdbc:${springVersion}")
    implementation("org.springframework:spring-tx:${springVersion}")
    implementation("org.springframework.security:spring-security-core:${springSecurityVersion}")
    implementation("org.springframework.security:spring-security-config:${springSecurityVersion}")
    implementation("org.springframework.security:spring-security-web:${springSecurityVersion}")
    implementation("org.springframework.security:spring-security-oauth2-jose:${springSecurityVersion}")
    implementation('ch.qos.logback:logback-classic:1.2.13')
    implementation('org.springframework.data:spring-data-redis:2.7.18')
    implementation('io.lettuce:lettuce-core:6.1.10.RELEASE')
    implementation('com.zaxxer:HikariCP:5.1.0')
    implementation('org.mybatis:mybatis:3.5.16')
    implementation('org.mybatis:mybatis-spring:2.1.2')
    implementation("org.flywaydb:flyway-core:${flywayVersion}")
    implementation("org.flywaydb:flyway-mysql:${flywayVersion}")
    implementation('org.hibernate.validator:hibernate-validator:6.2.5.Final')
    implementation('org.glassfish:javax.el:3.0.1-b12')
    implementation("com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}")
    implementation("org.webjars:swagger-ui:${swaggerUiVersion}")

    compileOnly("org.projectlombok:lombok:${lombokVersion}")
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

    runtimeOnly('com.mysql:mysql-connector-j:8.4.0')

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testImplementation('org.junit.jupiter:junit-jupiter-params:5.10.2')
    testImplementation('org.mockito:mockito-junit-jupiter:5.12.0')
    testImplementation("org.springframework:spring-test:${springVersion}")
    testImplementation("org.testcontainers:testcontainers-mysql:${testcontainersVersion}")
    testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
    testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    testImplementation('javax.servlet:javax.servlet-api:4.0.1')
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.10.2')
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
    description = 'Docker 기반 Testcontainers 통합 테스트를 실행합니다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn test

    classDirectories.setFrom(files(classDirectories.files.collect { directory ->
        fileTree(dir: directory, exclude: [
                '**/dto/**',
                '**/model/**',
                '**/global/config/**',
                '**/global/response/**'
        ])
    }))

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}
