    NotificationSettingsResponse:
      description: '인증 사용자에게 저장된 알림 유형별 수신 동의 상태입니다.'
      type: object
      required: [performanceClosingEnabled, nearbyBenefitEnabled, benefitLimitEnabled, marketingEnabled]
      properties:
        performanceClosingEnabled:
          description: '실적 마감 알림 수신 여부입니다.'
