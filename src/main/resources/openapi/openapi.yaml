          nullable: true
        userType:
          description: '사용자 권한 유형입니다.'
          type: string
          enum: [user, admin]
        cardSortMode:
          description: '홈 카드 정렬 방식입니다. AUTO는 서버 추천, MANUAL은 사용자 지정 순서입니다.'
          type: string
          enum: [AUTO, MANUAL]
