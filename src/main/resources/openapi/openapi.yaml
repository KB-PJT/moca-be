      required: [userCardId, cardName, cardNo, issuerId, issuerName, cardImageUrl, memo]
      properties:
        userCardId:
          description: 'userCard 리소스의 식별자입니다.'
          type: string
          format: uuid
          example: 01980d6a-5c0c-7aaf-9b85-010203040531
        cardName:
          description: '카드 상품명입니다.'
          type: string
          example: KB My WE:SH
        cardNo:
          type: string
          nullable: true
          description: CODEF resCardNo(마스킹된 카드번호)
          example: "943646******1069"
        issuerId:
          description: '카드 발급사 식별자입니다.'
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000301
        issuerName:
          type: string
          description: issuer 기준정보에 등록된 확정 카드사명입니다.
