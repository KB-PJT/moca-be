    SyncOwnedCardsResponse:
      description: '활성 카드사 계정 연동별 보유카드 재조회 결과입니다.'
      type: object
      required: [results]
      properties:
        results:
          description: '카드사 연동별 동기화 결과 목록입니다.'
          type: array
          items:
            $ref: '#/components/schemas/SyncOwnedCardsResult'
    SyncOwnedCardsResult:
      description: '카드사 계정 연동 한 건의 보유카드 재조회 성공 여부와 카드 목록입니다.'
      type: object
