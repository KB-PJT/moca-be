openapi: 3.0.3
info:
  title: MOCA Backend API
  description: |
    결제 전 최적 카드 추천을 위한 MOCA Backend REST API입니다.

    Google PKCE 로그인은 PWA가 authorization code를 받은 뒤 MOCA 서버가 Client Secret으로 교환합니다.
    이후 MOCA API는 서버가 발급한 opaque access token으로 인증합니다.
  version: 1.0.0
servers:
  - url: /api/v1
    description: MOCA API v1
tags:
  - name: Auth
    description: Google authorization code 검증 및 MOCA opaque 세션 관리
  - name: User
    description: 인증 사용자 프로필과 개인 설정 관리
  - name: Card
    description: 인증 사용자의 보유 카드 관리
  - name: CardLink
    description: CODEF 연동과 보유 카드 선택 등록
  - name: Home
    description: 인증 사용자의 홈 화면 컴포넌트 조회
  - name: Benefit
    description: 인증 사용자의 확정 혜택 이력 조회
  - name: Report
    description: 인증 사용자의 혜택·실적 월간 리포트 조회
  - name: Merchant
    description: 가맹점 카테고리 조회
  - name: Support
    description: 인증 사용자의 문의 등록
  - name: Notification
    description: 인증 사용자의 FCM 디바이스 토큰과 위치 기반 알림용 최근 위치 관리
  - name: Health
    description: 서버 상태 확인
paths:
  /devices:
    post:
      tags: [Notification]
      summary: FCM 디바이스 토큰 등록
      description: |
        인증 사용자의 FCM 토큰을 등록하거나 기존 토큰의 소유자·기기 유형을 갱신하고 활성화합니다.
        사용자 식별자는 요청에서 받지 않고 opaque access token의 인증 정보만 사용합니다.
      operationId: registerDevice
      security: [{ MocaBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
      responses:
        '200':
          description: 토큰 등록 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /users/me/location:
    put:
      tags: [Notification]
      summary: 최근 사용자 위치 갱신
      description: |
        인증 사용자의 위치 기반 알림 판단용 최근 위치를 Redis에 30분간 저장합니다.
        TTL이 만료되면 점심·저녁 주변 혜택 알림 대상에서 제외되며, 사용자 식별자는 인증 정보만 사용합니다.
      operationId: updateUserLocation
      security: [{ MocaBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLocationRequest' }
      responses:
        '200':
          description: 최근 위치 저장 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BooleanApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /health:
    get:
      tags: [Health]
      summary: 서버 상태 조회
      description: |
        인증 없이 서버 프로세스의 응답 가능 여부를 확인합니다.
        정상 응답의 `status`는 `UP`이며, 애플리케이션의 세부 의존성이나 외부 서비스 상태는 진단하지 않습니다.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 서버가 정상 동작 중임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /home/greeting:
    get:
      tags: [Home]
      summary: 홈 인사와 놓친 혜택 조회
      description: |
        인증 사용자의 홈 상단 인사말과 기준 월에 사용하지 않고 남긴 월 혜택 한도 합계를 반환합니다.
        `data.nickname`은 인사말에 표시할 사용자 닉네임이고, `data.yearMonth`는 집계 기준 월입니다.
        `data.missedBenefitAmount`는 전월 실적과 사용자가 선택한 카드 옵션에 따라 적용 가능한 월 한도에서
        기준 월의 확정 혜택 사용액을 차감한 잔여액의 합계입니다. `data.message`는 이 합계를 바탕으로 만든 홈 노출 문구입니다.
        yearMonth를 생략하면 Asia/Seoul 기준 현재 월을 사용하며, 남은 한도가 없으면 금액은 0입니다.
      operationId: getHomeGreeting
      security:
        - MocaBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/YearMonth'
      responses:
        '200':
          description: 사용자 닉네임, 집계 기준 월, 미사용 월 혜택 한도 합계와 홈 노출 문구
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeGreetingApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /home/cards:
    get:
      tags: [Home]
      summary: 홈 보유 카드 캐러셀 조회
      description: |
        인증 사용자의 홈 카드 캐러셀을 반환합니다. `data.yearMonth`는 집계 기준 월이고,
        `data.cards`의 각 항목에는 카드 식별·표시 정보, 대표 혜택, 해당 월 혜택·실적 요약이 담깁니다.
        `selectedUserCardId`는 현재 선택된 카드이며 없으면 null입니다. 보유 카드가 없으면 `cards`는 빈 배열입니다.
        yearMonth를 생략하면 Asia/Seoul 기준 현재 월을 사용합니다.
      operationId: getHomeCards
      security:
        - MocaBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/YearMonth'
        - name: orderMode
          in: query
          required: false
          description: 캐러셀 정렬 방식을 이번 조회에만 지정합니다. AUTO는 서버 추천 순서, MANUAL은 사용자가 저장한 순서입니다. 생략하면 사용자의 저장된 정렬 방식을 사용합니다.
          schema:
            type: string
            enum: [AUTO, MANUAL]
      responses:
        '200':
          description: 보유 카드와 당월 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeCardsApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /home/recent-history:
    get:
      tags: [Home]
      summary: 홈 최근 전체 결제 내역 조회
      description: |
        인증 사용자의 기준 월 카드 결제 승인 전체에서 최근 내역을 승인 시각 내림차순으로 반환합니다.
        혜택이 적용되지 않았거나 계산 결과가 없는 승인도 제외하지 않습니다.
        `calculationStatus`로 적용·부분 적용·미적용·미계산을 구분하며, 혜택이 없으면 혜택 관련 필드는 null 또는 0입니다.
        yearMonth를 생략하면 Asia/Seoul 기준 현재 월을 사용하고, limit을 생략하면 최대 5건을 반환합니다.
        userCardId를 지정하면 사용자가 보유한 해당 카드의 내역으로 제한하며, 생략하면 모든 보유카드를 조회합니다.
        승인내역이 없으면 `history`는 빈 배열입니다.
      operationId: getHomeRecentHistory
      security:
        - MocaBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/YearMonth'
        - name: limit
          in: query
          required: false
          description: 반환할 내역 수(1~5)
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 5
        - name: userCardId
          in: query
          required: false
          description: 특정 보유카드로 내역을 제한합니다. 생략하면 모든 보유카드를 조회합니다.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 최근 전체 결제 내역
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentHistoryApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /benefit-history:
    get:
      tags: [Benefit]
      summary: 전체 카드 결제 내역 목록 조회
      description: |
        인증 사용자의 카드 결제 승인 전체를 페이지 단위로 반환합니다. 확정 할인·캐시백·포인트·마일리지, 미적용 혜택,
        혜택 계산 결과가 아직 없는 일반 결제를 모두 포함합니다.
        보유카드와 혜택 유형으로 필터링할 수 있으며, type을 지정하면 혜택이 있는 내역만 반환합니다. 최신 승인순 또는 혜택 금액순으로 정렬할 수 있습니다.
        `data.data`에는 승인·가맹점·카드·혜택·실적 부족 정보가, `data.summary`에는 실제 확정 혜택의 월·카드 조건별 합계가,
        `data.meta`에는 페이지 번호·크기·전체 건수·다음 페이지 여부가 담깁니다.
        yearMonth를 생략하면 Asia/Seoul 기준 현재 월을 사용하며, 조회 결과가 없으면 목록은 빈 배열입니다.
      operationId: getBenefitHistory
      security:
        - MocaBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/YearMonth'
        - name: userCardId
          in: query
          description: 특정 보유카드로 결제 내역을 제한합니다. 생략하면 모든 보유카드를 조회합니다.
          schema: { type: string, format: uuid }
        - name: type
          in: query
          description: 조회할 혜택 유형입니다. 지정하면 해당 혜택이 있는 내역만 반환하며, 일반 결제는 제외됩니다. 생략하면 일반 결제를 포함한 전체 내역을 반환합니다.
          schema: { type: string, enum: [DISCOUNT, CASHBACK, POINT, MILEAGE] }
        - name: sort
          in: query
          description: 정렬 기준입니다. LATEST는 최신 승인순, BENEFIT_DESC는 혜택 금액 내림차순입니다.
          schema: { type: string, enum: [LATEST, BENEFIT_DESC], default: LATEST }
        - name: page
          in: query
          description: 1부터 시작하는 페이지 번호입니다.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          description: 페이지당 반환 건수입니다. 1~100 사이여야 합니다.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 전체 카드 결제 내역
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitHistoryApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /benefit-history/{benefitHistoryId}:
    get:
      tags: [Benefit]
      summary: 카드 결제 내역 상세 조회
      description: |
        로그인 사용자의 카드 결제 승인 한 건을 조회합니다. 승인 시각·가맹점·카드·결제금액과 계산된 혜택 정보를 반환하고,
        혜택 계산 결과가 없는 일반 결제는 `calculationStatus=NOT_CALCULATED`, 혜택 유형·제목은 null, 월 한도 값은 0입니다.
        `monthlyLimit`에는 혜택이 있는 경우 해당 혜택의 월 한도 사용액·전체 한도·잔여 한도가 담깁니다.
        실적 미충족 건은 `missedBenefitAmount`, `rejectionReason`, `performanceShortfall`을 제공하며 실제 적용 혜택은 0입니다.
        마일리지 적립 건만 `earnedMileage`가 값으로 제공되고 그 외에는 null이며, 다른 사용자의 이력은 조회할 수 없습니다.
      operationId: getBenefitHistoryDetail
      security:
        - MocaBearerAuth: []
      parameters:
        - name: benefitHistoryId
          in: path
          required: true
          description: 목록에서 받은 결제 내역 식별자입니다. 혜택 내역은 혜택 사용 또는 미적용 결과 식별자, 일반 결제는 승인 식별자입니다.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 카드 결제 내역 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitHistoryDetailApiResponse' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '404':
          description: 로그인 사용자의 결제 내역이 없음
  /reports/benefits/summary:
    get:
      tags: [Report]
      summary: 월별 혜택 합계와 전월 비교 조회
      description: 선택한 월의 확정 혜택 합계와 직전 달 대비 증감액을 혜택 유형별로 반환합니다. yearMonth를 생략하면 Asia/Seoul 현재 월을 사용합니다.
      operationId: getBenefitReportSummary
      security: [{ MocaBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/YearMonth' }]
      responses:
        '200':
          description: 월별 혜택 합계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitSummaryReportApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /reports/benefits/categories:
    get:
      tags: [Report]
      summary: 월별 혜택 상위 가맹점 카테고리 조회
      description: |
        기준 월의 확정 혜택을 가맹점 카테고리별로 합산해 혜택 금액이 큰 순서로 반환합니다.
        `data.categories`의 각 항목에는 순위, 카테고리 코드·이름과 혜택 합계가 담기며, limit으로 최대 3개까지 지정할 수 있습니다.
        merchant가 매핑된 승인내역만 집계하고, 집계 결과가 없으면 `categories`는 빈 배열입니다.
      operationId: getBenefitReportCategories
      security: [{ MocaBearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/YearMonth'
        - name: limit
          in: query
          description: 반환할 상위 카테고리 수입니다. 1~3 사이이며 기본값은 3입니다.
          schema: { type: integer, minimum: 1, maximum: 3, default: 3 }
      responses:
        '200':
          description: 월별 상위 카테고리
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitCategoriesReportApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /reports/benefits/missed:
    get:
      tags: [Report]
      summary: 카드별 미사용 월 혜택 한도 조회
      description: |
        지정한 활성 보유카드에서 기준 월에 사용하지 않고 남긴 월 혜택 한도를 반환합니다.
        `data.userCard`에는 대상 카드가, `data.totalMissedBenefitAmount`에는 잔여 한도 합계가,
        `data.benefits`에는 규칙별 사용액·한도·잔여액이 담깁니다.
        전월 실적과 사용자의 카드 옵션 선택을 모두 충족한 혜택만 집계합니다. 원화 혜택 한도와
        정액 할인·캐시백의 월 이용 횟수 한도만 원화로 계산하며, 한도가 없거나 원화로 환산할 수 없는 혜택은 제외합니다.
      operationId: getBenefitReportMissed
      security: [{ MocaBearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/YearMonth'
        - name: userCardId
          in: query
          required: true
          description: 미사용 월 혜택 한도를 조회할 활성 보유카드의 식별자입니다.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 미사용 월 혜택 한도
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissedBenefitsReportApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '404': { description: 본인 소유의 활성 카드를 찾을 수 없음 }
  /reports/performances/summary:
    get:
      tags: [Report]
      summary: 월 실적 도넛과 대표 카드 조회
      description: |
        선택한 월의 카드 실적을 홈·리포트 요약용으로 반환합니다.
        `data.cardCount`와 `achievedCardCount`는 전체 카드 수와 실적 달성 카드 수이고,
        `data.cards`에는 최대 3개 카드의 상품명·달성률·현재 구간 달성 여부가 담깁니다.
        yearMonth를 생략하면 Asia/Seoul 현재 월을 사용하고, 대상 카드가 없으면 `cards`는 빈 배열입니다.
      operationId: getPerformanceReportSummary
      security: [{ MocaBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/YearMonth' }]
      responses:
        '200':
          description: 실적 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceSummaryReportApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /reports/performances/cards:
    get:
      tags: [Report]
      summary: 월별 전체 카드 실적 조회
      description: |
        인증 사용자의 모든 활성 카드에 대해 기준 월 인정 실적과 구간 달성 현황을 반환합니다.
        각 카드에는 현재 인정 실적, 목표 금액, 달성률, 현재 구간과 다음 구간까지 남은 금액이 담깁니다.
        현재 카드 원천 데이터에 실적 tier가 없으면 `currentTier=0`, `nextTier=null`로 반환하며,
        대상 카드가 없으면 `data.cards`는 빈 배열입니다.
      operationId: getPerformanceReportCards
      security: [{ MocaBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/YearMonth' }]
      responses:
        '200':
          description: 카드별 실적 현황
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceCardsReportApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /merchants/categories:
    get:
      tags: [Merchant]
      summary: 가맹점 카테고리 목록 조회
      description: >-
        지도 기반 주변 혜택 검색에서 선택할 수 있는 활성 가맹점 카테고리의 식별자·코드·표시명을 반환합니다.
        간편결제·OTT처럼 물리적 위치가 없어 지도에서 검색할 수 없는 카테고리는 포함하지 않으며,
        제공할 카테고리가 없으면 data는 빈 배열입니다.
      operationId: getMerchantCategories
      security:
        - MocaBearerAuth: []
      responses:
        '200':
          description: 카테고리 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantCategoriesApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /merchants:
    get:
      tags: [Merchant]
      summary: 카테고리별 가맹점 목록 조회
      description: |
        지정한 카테고리에 속한 활성 가맹점 또는 브랜드의 식별자와 표시명을 반환합니다.
        카테고리는 `/merchants/categories`에서 받은 categoryId를 사용해야 하며,
        등록된 가맹점이 없으면 data는 빈 배열, 카테고리가 없거나 지도 검색 대상이 아니면 404를 반환합니다.
      operationId: getMerchantsByCategory
      security:
        - MocaBearerAuth: []
      parameters:
        - name: categoryId
          in: query
          required: true
          description: 조회할 가맹점 카테고리의 식별자입니다.
          schema:
            type: string
      responses:
        '200':
          description: 가맹점 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantsApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/MerchantCategoryNotFound'
  /merchants/nearby:
    get:
      tags: [Merchant]
      summary: 카테고리별 근처 가맹점 조회
      description: >-
        카카오맵 로컬 API로 반경 내 가맹점을 검색해 우리 DB에 있는 가맹점만 반환합니다.
        bestRecommendation(혜택 요약)은 아직 계산하지 않아 이 응답에는 포함하지 않습니다.
      operationId: getNearbyMerchants
      security:
        - MocaBearerAuth: []
      parameters:
        - name: categoryId
          in: query
          required: true
          description: 근처 가맹점을 검색할 가맹점 카테고리의 식별자입니다.
          schema:
            type: string
        - name: latitude
          in: query
          required: true
          description: 검색 중심점의 위도(WGS84)입니다.
          schema:
            type: number
            format: double
        - name: longitude
          in: query
          required: true
          description: 검색 중심점의 경도(WGS84)입니다.
          schema:
            type: number
            format: double
        - name: radiusMeters
          in: query
          required: false
          description: 100~3000, 기본값 150
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 150
        - name: merchantId
          in: query
          required: false
          description: 지정하면 그 카테고리 안에서 해당 가맹점(브랜드)만 조회합니다.
          schema:
            type: string
      responses:
        '200':
          description: 근처 가맹점 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyMerchantsApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: >-
            존재하지 않거나 지도 대상이 아닌 categoryId(code=MERCHANT_CATEGORY_NOT_FOUND),
            또는 해당 카테고리에 없는 merchantId(code=MERCHANT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/KakaoUnavailableError'
  /merchants/{merchantId}/card-recommendations:
    get:
      tags: [Merchant]
      summary: 가맹점별 보유 카드 혜택 추천 조회
      description: |
        가맹점의 내부 카테고리와 구조화된 카드 혜택 대상을 대조해 인증 사용자의 활성 보유 카드만 추천합니다.
        응답은 가맹점 정보, MOCA 대표 추천 카드, 보유 카드 혜택 순위의 세 영역으로 구성됩니다.
        해당 가맹점에 적용되는 보유 카드가 없으면 `recommendedCard=null`, `rankedCards=[]`입니다.
        결제금액을 생략하면 비교용 예상 혜택 계산에 10,000원을 사용합니다. 전월 실적 데이터가 없으면
        0원으로 보수적으로 판단하며 확정 카드사 혜택이 아닌 구조화 룰 기반 예상값입니다.
      operationId: getMerchantCardRecommendations
      security: [{ MocaBearerAuth: [] }]
      parameters:
        - name: merchantId
          in: path
          required: true
          description: 추천을 조회할 내부 가맹점 식별자입니다.
          schema: { type: string }
        - name: paymentAmount
          in: query
          required: false
          description: 예상 혜택 계산에 사용할 결제 예정 금액(원), 기본값 10000입니다.
          schema: { type: number, minimum: 1, default: 10000 }
      responses:
        '200':
          description: 가맹점과 온보딩 성향에 맞춘 보유 카드 추천
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantCardRecommendationApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '404':
          description: merchantId에 해당하는 활성 가맹점이 없습니다(code=MERCHANT_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /merchants/place-card-recommendations:
    get:
      tags: [Merchant]
      summary: Kakao 장소별 보유 카드 혜택 추천 조회
      description: |
        Kakao 장소명을 내부 merchant와 먼저 정확히 대조하고, 일치하지 않을 때만 Kakao 그룹코드와
        상세 category_name을 이용해 내부 merchant_category를 추정합니다. `ALLOW` 매핑이면서 룰의
        minimumPlaceConfidence 이상인 경우에만 카테고리 혜택 후보를 반환합니다.
        `DISPLAY_ONLY`, 미지원 그룹 또는 불명확한 HP8/OL7/CT1 장소는 확정 혜택처럼 추천하지 않으며
        `recommendedCard=null`, `rankedCards=[]`로 반환합니다. 결과는 카드사 승인업종 확정값이 아닙니다.
      operationId: getPlaceCardRecommendations
      security: [{ MocaBearerAuth: [] }]
      parameters:
        - name: placeName
          in: query
          required: true
          description: Kakao 장소명입니다. 등록 merchant와 일치하면 category 추정보다 우선합니다.
          schema: { type: string, minLength: 1 }
        - name: categoryGroupCode
          in: query
          required: true
          description: Kakao 공식 category group code입니다.
          schema: { type: string, minLength: 2, maxLength: 3 }
        - name: categoryName
          in: query
          required: false
          description: Kakao 상세 category_name입니다. HP8, OL7, CT1 세부 판정에 사용합니다.
          schema: { type: string }
        - name: paymentAmount
          in: query
          required: false
          description: 예상 혜택 계산 결제금액(원)이며 기본값은 10000입니다.
          schema: { type: number, minimum: 1, default: 10000 }
      responses:
        '200':
          description: 보수적으로 판정한 장소별 보유 카드 예상 혜택 추천
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantCardRecommendationApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /card-links:
    post:
      tags: [CardLink]
      summary: CODEF 카드 연동(Connected ID) 생성
      description: |
        카드사 자격정보로 CODEF Connected ID를 생성합니다.
        비밀번호는 CODEF 공개키로 RSA 암호화해 전송하며, 저장 시 자격정보는 AES로 암호화합니다.
        카드번호가 필요 없는 카드사는 이 호출에서 보유카드까지 바로 조회해 cards로 내려줍니다.
        카드번호가 필요한 카드사(policy.requiresCardNo)는 이 호출에서 보유카드 조회를 하지 않고
        cards를 항상 빈 배열로 내려줍니다 — 방금 입력한 cardNo/cardPassword는 서버가 암호화해
        잠깐 보관해두고, 클라이언트가 로딩 UX 등을 이유로 보유카드 조회를 별도 타이밍에 하고 싶을 때
        POST /card-links/cards/sync(보유카드 재조회)를 호출하면 그 값을 이어받아 조회합니다
        (카드번호를 다시 입력받지 않아도 됩니다). connectedId 발급 이후 자격정보는 먼저 저장되므로,
        카드번호가 필요 없는 카드사에서 뒤이은 보유카드 조회가 실패해도 연동 생성 자체는 201로
        성공하고 cards는 빈 배열로 내려갑니다. 이 경우에도 POST /card-links/cards/sync로 보유카드만
        다시 조회할 수 있습니다.
      operationId: createCardLink
      security:
        - MocaBearerAuth: []
      requestBody:
        description: CODEF 계정 연동에 필요한 카드사 기관코드와 자격정보입니다.
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institutionCode]
              properties:
                institutionCode:
                  type: string
                  description: 카드사 기관코드(issuers.institution_code, 예 "0301"). 서버가 내부 issuer_id로 변환합니다.
                  example: "0301"
                id:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
                password:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
                cardNo:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
                cardPassword:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
                birthDate:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
      responses:
        '201':
          description: 연동 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLinkApiResponse'
        '400':
          description: >-
            요청값 검증 실패(code=VALIDATION_FAILED), 카드사 필수 자격정보 누락
            (code=CODEF_CREDENTIAL_REQUIRED), 또는 카드사 로그인 아이디·비밀번호 오류
            (code=CODEF_INVALID_CREDENTIALS — 재시도 안내가 아니라 정보를 다시 확인하라는 뜻입니다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /merchants/card-recommendations:
    get:
      tags: [Merchant]
      summary: 가맹점 목록용 보유 카드 추천 일괄 조회
      description: |
        인증 사용자의 활성 보유 카드를 최대 50개 가맹점에 대해 일괄 추천합니다.
        가맹점·카테고리 계보·혜택 후보를 각각 한 번씩 조회하여 가맹점 수에 따른 N+1 조회를 방지합니다.
        존재하지 않거나 추천 카드가 없는 가맹점도 입력 순서대로 대표 추천 null과 빈 순위를 반환합니다.
      operationId: getMerchantCardRecommendationBatch
      security: [{ MocaBearerAuth: [] }]
      parameters:
        - name: merchantIds
          in: query
          required: true
          description: 반복 쿼리 파라미터로 전달하는 내부 가맹점 식별자이며 중복 제거 후 처리합니다.
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: string }
        - name: paymentAmount
          in: query
          required: false
          description: 모든 가맹점 예상 혜택에 공통 적용할 결제 예정 금액이며 기본값은 10000원입니다.
          schema: { type: number, minimum: 1, default: 10000 }
      responses:
        '200':
          description: 입력 가맹점 순서의 카드 추천 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantCardRecommendationBatchApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /card-links/{linkId}/cards:
    patch:
      tags: [CardLink]
      summary: 적재된 보유카드 활성화 및 옵션 선택
      description: 이미 적재된(비활성) 보유카드 중 지정한 카드를 활성화하고 선택형 카드의 옵션을 저장합니다. 신규 카드 적재나 원본 데이터 로딩은 하지 않습니다.
      operationId: activateCardLinkCards
      security:
        - MocaBearerAuth: []
      parameters:
        - name: linkId
          in: path
          required: true
          description: >-
            연동 한 건(= 카드사 계정 자격정보)의 식별자로, codef_account_credential_id와 같습니다.
            POST /card-links 응답의 linkId를 그대로 사용하며, 이 연동으로 적재된 user_cards만 활성화 대상이 됩니다.
            (개별 카드 식별자 userCardId와는 다릅니다.)
          schema:
            type: string
            format: uuid
      requestBody:
        description: 활성화할 보유카드와 선택형 카드의 옵션입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateCardLinkCardsRequest'
      responses:
        '200':
          description: 활성화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateCardLinkCardsApiResponse'
        '400':
          description: >-
            요청값 검증 실패(code=VALIDATION_FAILED), 연동에 속하지 않은 카드·옵션 오류
            (code=INVALID_CARD_SELECTION), 또는 카드사가 요구하는 카드번호/비밀번호가 이 카드에
            저장돼 있지 않음(code=CARD_CREDENTIAL_REQUIRED — error.fields.userCardId에 문제 있는
            카드의 user_card_id를 콤마로 구분해 담습니다(카드 한 장이면 한 개만). PATCH
            /card-links/cards/{userCardId}/credentials로 채운 뒤 다시 시도해야 합니다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: 본인 소유의 미확정 연동을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /card-links/cards/sync:
    post:
      tags: [CardLink]
      summary: 보유카드 재조회
      description: |
        사용자의 활성 CODEF 연동(카드사 계정)별로 보유카드를 다시 조회해 새로 매칭된 카드만 추가로
        적재합니다. institutionCode를 주면 그 카드사 연동만, 생략하면 모든 활성 연동을 대상으로 합니다.
        이미 적재된 카드는 다시 적재하지 않고 기존 카드를 그대로 응답합니다.
        카드번호가 필요한 카드사에서 아직 크리덴셜을 가진 카드가 하나도 없다면(=POST /card-links로
        연동을 만든 뒤 처음 하는 재조회), 그때 입력받아 서버가 잠깐 보관해둔 카드번호/비밀번호를 이
        호출이 이어받아 씁니다 — 별도의 "보유카드 조회 2단계" API 없이 이 재조회 API 하나로 최초
        조회부터 이후 재조회까지 처리합니다. 보관해둔 값은 그 카드번호가 실제로 어느 보유카드에
        저장됐을 때만 삭제되고, 카탈로그 매칭 실패 등으로 저장되지 않으면(성공 응답이더라도) 다음
        재조회에서 다시 시도할 수 있도록 그대로 남습니다. 이미 크리덴셜을 가진 카드가 있으면 그
        카드번호를 그대로 재사용하는 기존 동작 그대로입니다.
        연동 하나가 CODEF 조회 자체에 실패하면 그 연동만 success=false로 응답하고 다른 연동에는
        영향을 주지 않습니다(전체 요청은 200). 정상 조회했지만 매칭된 카드가 0건인 경우는 실패가
        아니라 success=true에 cards가 빈 배열로 내려갑니다.
      operationId: syncOwnedCards
      security:
        - MocaBearerAuth: []
      parameters:
        - name: institutionCode
          in: query
          required: false
          description: 카드사 기관코드(issuers.institution_code). 생략하면 모든 활성 연동을 재조회합니다.
          schema:
            type: string
            example: "0301"
      responses:
        '200':
          description: 재조회 성공(연동별 결과 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncOwnedCardsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: 지정한 기관코드로 연동된 활성 계정이 없음(code=CODEF_CONNECTION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /card-links/cards/{userCardId}/credentials:
    patch:
      tags: [CardLink]
      summary: 카드별 카드번호/비밀번호 추가 입력
      description: |
        카드번호가 필요한 카드사에서, 계정 생성 시 입력한 카드와 일치하지 않아 카드번호/비밀번호가
        비어 있는 보유카드에 값을 채웁니다. 입력한 카드번호/비밀번호로 그 카드사 connectedId와 함께
        보유카드 조회를 호출해 정상 응답을 받으면 유효한 것으로 보고 암호화해 저장합니다.
        이 요청만으로는 카드가 활성화되지 않습니다(is_active는 그대로 false). 응답은 옵션 그룹을
        포함한 카드 정보이며, 옵션이 있으면 골라서 PATCH /card-links/{linkId}/cards로 별도
        활성화해야 합니다(활성화 경로를 하나로 유지해 옵션 검증을 항상 거치게 하기 위함입니다).
      operationId: submitCardCredentials
      security:
        - MocaBearerAuth: []
      parameters:
        - name: userCardId
          in: path
          required: true
          description: 카드정보를 채울 보유카드(user_cards)의 식별자
          schema:
            type: string
            format: uuid
      requestBody:
        description: 카드사 검증에 필요한 카드번호와 비밀번호 추가 입력값입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCardCredentialsRequest'
      responses:
        '200':
          description: 저장 성공(옵션 그룹을 포함한 카드 정보 반환, 활성화는 별도 요청 필요)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLinkCardApiResponse'
        '400':
          description: >-
            요청값 검증 실패(code=VALIDATION_FAILED), 카드번호/비밀번호 누락
            (code=CARD_CREDENTIAL_REQUIRED), 이 카드사는 카드번호가 필요하지 않음
            (code=INVALID_CARD_SELECTION), 또는 입력한 카드번호가 이 카드의 저장된 마스킹
            카드번호(앞·뒤 노출 자리)와 일치하지 않음(code=CARD_NUMBER_MISMATCH — CODEF를
            호출하지 않고 로컬에서 먼저 걸러낸 결과입니다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: 본인 소유의 카드를 찾을 수 없음(code=USER_CARD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/CodefUnavailableError'
  /auth/google/login:
    post:
      tags: [Auth]
      summary: Google authorization code로 MOCA 로그인
      description: |
        PWA는 callback에서 받은 authorization code, code verifier, redirect URI를 전달합니다.
        서버는 Google access token을 교환하고 tokeninfo의 audience, 만료, scope, user_id를 검증합니다.
        PWA는 Google OAuth 요청에 openid, userinfo.email, userinfo.profile scope를 포함해야 하며,
        서버는 UserInfo의 profile name을 신규 회원의 nickname으로 저장합니다.
        refresh token은 JSON이 아닌 HttpOnly cookie로만 반환합니다.
      operationId: loginWithGoogle
      security: []
      requestBody:
        description: PWA가 PKCE 절차로 발급받은 Google authorization code입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLoginApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Google authorization code 또는 access token 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: MOCA access token 갱신
      description: |
        브라우저가 전송한 HttpOnly refresh token cookie를 검증하고 기존 세션을 회전합니다.
        응답 본문에는 새 opaque access token과 초 단위 만료시간이 담기며, 새 refresh token은 JSON이 아니라 HttpOnly cookie로만 설정됩니다.
        refresh token이 없거나 만료·폐기되었으면 401을 반환합니다.
      operationId: refreshToken
      security: []
      responses:
        '200':
          description: 갱신 성공
          headers:
            Set-Cookie:
              description: 회전된 HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenApiResponse'
        '401':
          description: refresh cookie가 없거나 만료됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: MOCA 로그아웃
      description: |
        access token 또는 refresh cookie에 연결된 Redis 세션을 폐기하고 refresh cookie를 만료시킵니다.
        유효한 세션이 없어도 클라이언트가 로컬 인증 상태를 정리할 수 있도록 성공 응답을 반환합니다.
        요청 body에 fcmToken을 함께 보내면 access token으로 확인한 소유자 명의의 디바이스 매핑만 비활성화하여
        로그아웃 이후 이전 계정으로 알림이 전송되지 않도록 합니다. access token이 없거나 무효하면, 또는
        fcmToken이 다른 사용자 명의라면 디바이스 매핑은 그대로 두고 세션 폐기만 진행합니다.
      operationId: logout
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: 만료된 refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessApiResponse'
  /me:
    get:
      tags: [User]
      summary: 내 프로필 조회
      description: |
        MOCA opaque access token으로 인증한 사용자의 식별자, 닉네임, 이메일, 권한 유형과 홈 카드 정렬 방식을 반환합니다.
        Google 계정에서 이메일을 제공하지 않았으면 email은 null입니다.
      operationId: getMyProfile
      security:
        - MocaBearerAuth: []
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
    delete:
      tags: [User]
      summary: 회원 탈퇴
      description: |
        인증 사용자의 탈퇴 의사를 확인한 뒤 사용자 정보와 연관 설정·탈퇴 대상 데이터를 삭제합니다.
        `confirmed`가 true여야 처리하며, reason과 reasonDetail은 선택적으로 탈퇴 사유를 전달합니다.
        성공하면 인증 세션도 더 이상 사용할 수 없습니다.
      operationId: withdrawMe
      security:
        - MocaBearerAuth: []
      requestBody:
        description: 탈퇴 사유와 최종 확인값입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawUserRequest'
      responses:
        '200':
          description: 탈퇴 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/nickname:
    patch:
      tags: [User]
      summary: 내 닉네임 변경
      description: |
        인증 사용자의 닉네임을 1~50자 값으로 변경합니다.
        성공 응답에는 변경된 닉네임을 포함한 사용자 식별자·이메일·권한 유형·카드 정렬 방식의 최신 프로필이 담깁니다.
      operationId: updateMyNickname
      security:
        - MocaBearerAuth: []
      requestBody:
        description: 변경할 닉네임입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNicknameRequest'
      responses:
        '200':
          description: 닉네임 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/cards:
    get:
      tags: [Card]
      summary: 내 카드 목록 조회
      description: |
        인증 사용자의 활성 카드와 선택적인 비활성 카드 목록을 반환합니다.
      operationId: getMyCards
      security:
        - MocaBearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          required: false
          description: true이면 비활성 카드를 포함하고, false이면 활성 카드만 반환합니다.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 내 카드 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeCardsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/cards/sync:
    post:
      tags: [Card]
      summary: 승인내역 동기화
      description: |
        연결된 카드사의 승인내역(거래내역)을 CODEF에서 조회해 새로 발견한 정상 국내 승인건만 중복 없이 적재합니다.
        취소·부분취소·거절 및 해외결제는 반전 처리하지 않으며 승인 적재·혜택 계산·미적용 혜택 집계에서 모두 제외합니다.
        startDate/endDate를 생략하면 이번 달 1일부터 오늘까지(KST) 조회합니다.
        또한 카드별 실적현황을 CODEF에서 조회해 인정 실적금액을 최신 값으로 upsert합니다. 실적 조회 대상 월은
        startDate가 속한 달(기본값 이번 달)이며, 가능하면 그 전월 실적도 함께 조회해 적재합니다. 연동 중
        하나라도 승인내역 또는 대상 월 실적조회 호출 자체가 실패하면 전체 동기화를 실패로 처리하고 재시도
        가능한 503으로 응답합니다. 요청한 달을 카드사가 애초에 지원하지 않는 경우(카드사 실적조회 미지원
        또는 조회 가능 범위 초과)는 재시도해도 항상 실패하는 영구 조건이므로 503이 아니라 400으로 응답합니다.
        전월 실적은 부가 정보라 카드사가 지원하지 않거나 조회에 실패해도 전월분만 건너뛸 뿐 전체 동기화를
        실패시키지 않습니다.
        institutionCode를 주면 그 카드사 연동만, 생략하면 모든 활성 연동을 대상으로 동기화합니다.
      operationId: syncMyCardApprovals
      security:
        - MocaBearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: 조회 시작일(KST, YYYY-MM-DD). 생략 시 이번 달 1일.
          schema:
            type: string
            format: date
            example: "2026-08-01"
        - name: endDate
          in: query
          required: false
          description: 조회 종료일(KST, YYYY-MM-DD). 생략 시 오늘.
          schema:
            type: string
            format: date
            example: "2026-08-03"
        - name: institutionCode
          in: query
          required: false
          description: 카드사 기관코드(issuers.institution_code). 생략하면 모든 활성 연동을 동기화합니다.
          schema:
            type: string
            example: "0301"
      responses:
        '200':
          description: 승인내역 동기화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMyCardsApiResponse'
        '400':
          description: >-
            요청값 검증 실패(code=VALIDATION_FAILED), 또는 요청한 달을 카드사가 애초에 지원하지 않음
            (code=PERFORMANCE_UNSUPPORTED — 카드사 실적조회 미지원 또는 조회 가능 범위 초과. 재시도해도
            항상 실패하는 영구 조건이라 503이 아닙니다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          description: 지정한 기관코드로 연동된 활성 계정이 없음(code=CODEF_CONNECTION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/CardSyncFailedError'
  /me/cards/{userCardId}:
    get:
      tags: [Card]
      summary: 보유 카드 상세정보 조회
      description: |
        인증 사용자가 소유한 보유 카드 한 장의 상세정보(카드 정보·메모·주요 혜택·유의사항)를 반환합니다.
        benefits/notices는 card_benefits의 record_type이 각각 benefit/notice인 항목이며,
        detailText/detailHtml을 함께 포함합니다. 본인 소유가 아니거나 존재하지 않는 카드면 404를 반환합니다.
      operationId: getMyCardDetail
      security:
        - MocaBearerAuth: []
      parameters:
        - name: userCardId
          in: path
          required: true
          description: 상세정보를 조회할 보유카드(user_cards)의 식별자
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 보유 카드 상세정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetailApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          description: 본인 소유의 카드를 찾을 수 없음(code=USER_CARD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Card]
      summary: 보유 카드 연결 해제
      description: |
        인증 사용자가 소유한 보유 카드(user_cards)의 연결을 해제합니다.
        해당 카드를 참조하는 승인내역·혜택 사용/계산 내역·옵션 선택·실적 스냅샷을 모두 함께 삭제한 뒤
        user_cards 행을 삭제합니다. 본인 소유가 아니거나 존재하지 않는 카드면 404를 반환합니다.
      operationId: disconnectMyCard
      security:
        - MocaBearerAuth: []
      parameters:
        - name: userCardId
          in: path
          required: true
          description: 연결을 해제할 보유카드(user_cards)의 식별자
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 카드 연결 해제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          description: 본인 소유의 카드를 찾을 수 없음(code=USER_CARD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/cards/{userCardId}/deactivate:
    patch:
      tags: [Card]
      summary: 보유 카드 비활성화
      description: |
        인증 사용자가 소유한 보유 카드(user_cards)를 비활성화합니다.
        연결 해제와 달리 데이터는 삭제되지 않고 is_active만 false로 변경되어
        홈/목록 조회에서 활성 카드 목록 대신 비활성 카드 목록으로 이동합니다.
        본인 소유가 아니거나 존재하지 않는 카드면 404를 반환합니다.
      operationId: deactivateMyCard
      security:
        - MocaBearerAuth: []
      parameters:
        - name: userCardId
          in: path
          required: true
          description: 비활성화할 보유카드(user_cards)의 식별자
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 카드 비활성화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          description: 본인 소유의 카드를 찾을 수 없음(code=USER_CARD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/cards/{userCardId}/memo:
    patch:
      tags: [Card]
      summary: 보유 카드 메모 수정
      description: |
        인증 사용자가 소유한 보유 카드의 메모를 수정합니다. memo를 생략하거나 null로 보내면 메모를 비웁니다.
        본인 소유가 아니거나 존재하지 않는 카드면 404를 반환합니다.
      operationId: updateMyCardMemo
      security:
        - MocaBearerAuth: []
      parameters:
        - name: userCardId
          in: path
          required: true
          description: 메모를 수정할 보유카드(user_cards)의 식별자
          schema:
            type: string
            format: uuid
      requestBody:
        description: 카드에 저장할 새 메모입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemoRequest'
      responses:
        '200':
          description: 메모 수정 성공(갱신된 카드 정보 반환)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeCardItemApiResponse'
        '400':
          description: 요청값 검증 실패(code=VALIDATION_FAILED) — 메모가 500자를 초과함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: 본인 소유의 카드를 찾을 수 없음(code=USER_CARD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/cards/order:
    patch:
      tags: [Card]
      summary: 보유 카드 순서 변경
      description: |
        인증 사용자의 활성 보유 카드 표시 순서를 변경합니다.
        userCardIds는 사용자가 보유한 활성 카드 전체를 원하는 순서대로 중복 없이 포함해야 하며,
        목록 내 위치가 곧 새 display_order가 됩니다.
        누락되거나 중복되거나 본인 소유가 아닌 카드가 포함되면 400을 반환합니다.
      operationId: reorderMyCards
      security:
        - MocaBearerAuth: []
      requestBody:
        description: 활성 보유 카드의 새 순서입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderMyCardsRequest'
      responses:
        '200':
          description: 순서 변경 성공(갱신된 카드 목록 반환)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeCardsApiResponse'
        '400':
          description: 요청값 검증 실패(code=VALIDATION_FAILED) 또는 활성 카드 전체와 불일치(code=INVALID_CARD_ORDER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /me/card-sort-mode:
    patch:
      tags: [User]
      summary: 홈 보유 카드 정렬 방식 변경
      description: |
        인증 사용자의 홈 카드 캐러셀 정렬 방식을 저장합니다.
        AUTO는 서버 추천 규칙 순서, MANUAL은 사용자가 지정한 카드 순서를 사용하며,
        성공 응답에는 변경된 cardSortMode를 포함한 최신 사용자 프로필이 담깁니다.
      operationId: updateMyCardSortMode
      security:
        - MocaBearerAuth: []
      requestBody:
        description: 홈 보유 카드에 적용할 정렬 방식입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardSortModeRequest'
      responses:
        '200':
          description: 카드 정렬 방식 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/notification-settings:
    get:
      tags: [User]
      summary: 내 알림 설정 조회
      description: |
        인증 사용자의 알림 설정을 조회합니다.
        응답에는 실적 마감, 주변 혜택, 혜택 한도와 마케팅 알림의 수신 여부가 각각 boolean 값으로 담깁니다.
      operationId: getMyNotificationSettings
      security:
        - MocaBearerAuth: []
      responses:
        '200':
          description: 알림 설정 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
    patch:
      tags: [User]
      summary: 내 알림 설정 변경
      description: |
        실적 마감, 주변 혜택, 혜택 한도와 마케팅 알림의 수신 여부를 한 번에 저장합니다.
        모든 설정값을 요청 본문에 포함해야 하며, 성공 응답은 저장된 최신 설정 전체를 반환합니다.
      operationId: updateMyNotificationSettings
      security:
        - MocaBearerAuth: []
      requestBody:
        description: 알림 유형별 수신 동의 상태입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsRequest'
      responses:
        '200':
          description: 알림 설정 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/onboarding-status:
    get:
      tags: [User]
      summary: 신규 사용자 여부 조회
      description: |
        인증 사용자가 카드 연동 온보딩이 필요한 신규 사용자인지 반환합니다.
        활성·비활성 여부와 관계없이 보유카드가 하나도 없으면 `data.newUser=true`, 하나 이상이면 false입니다.
      operationId: getMyOnboardingStatus
      security:
        - MocaBearerAuth: []
      responses:
        '200':
          description: 신규 사용자 여부 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatusApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/location-settings:
    get:
      tags: [User]
      summary: 내 위치 추천 설정 조회
      description: |
        인증 사용자의 위치 기반 주변 혜택 추천 사용 여부를 조회합니다.
        `data.locationRecommendationEnabled`가 true이면 위치 기반 추천을 사용하도록 동의한 상태입니다.
      operationId: getMyLocationSettings
      security:
        - MocaBearerAuth: []
      responses:
        '200':
          description: 위치 추천 설정 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSettingsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
    patch:
      tags: [User]
      summary: 내 위치 추천 설정 변경
      description: |
        인증 사용자의 위치 기반 주변 혜택 추천 사용 여부를 저장합니다.
        성공 응답의 `data.locationRecommendationEnabled`에는 실제로 저장된 최신 값이 담깁니다.
      operationId: updateMyLocationSettings
      security:
        - MocaBearerAuth: []
      requestBody:
        description: 위치 기반 혜택 추천 사용 여부입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationSettingsRequest'
      responses:
        '200':
          description: 위치 추천 설정 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSettingsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /support/inquiries:
    post:
      tags: [Support]
      summary: 문의 등록
      description: |
        인증 사용자가 운영팀에 보낼 문의를 등록합니다. inquiryType, title, content, replyEmail은 모두 필수입니다.
        등록된 문의는 status=received 상태로 저장됩니다.
      operationId: createInquiry
      security:
        - MocaBearerAuth: []
      requestBody:
        description: 등록할 문의의 유형·제목·내용·답변받을 이메일입니다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
      responses:
        '201':
          description: 문의 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryApiResponse'
        '400':
          description: >-
            요청값 검증 실패(code=VALIDATION_FAILED) —
            inquiryType/title/content/replyEmail이 비어 있거나 형식·길이 제한을 위반함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /me/benefit-preference:
    get:
      tags: [User]
      summary: 내 카드 혜택 선호 조회
      description: 인증 사용자의 온보딩 카드 혜택 선호를 반환합니다. 미선택 사용자의 기본값은 `IMMEDIATE_SAVINGS`입니다.
      operationId: getMyBenefitPreference
      security: [{ MocaBearerAuth: [] }]
      responses:
        '200':
          description: 저장된 카드 혜택 선호
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitPreferenceApiResponse' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
    patch:
      tags: [User]
      summary: 내 카드 혜택 선호 변경
      description: 온보딩에서 선택한 네 가지 혜택 성향 중 하나를 인증 사용자에게 저장합니다.
      operationId: updateMyBenefitPreference
      security: [{ MocaBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BenefitPreferenceRequest' }
      responses:
        '200':
          description: 변경된 카드 혜택 선호
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitPreferenceApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
components:
  securitySchemes:
    MocaBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Google token이 아닌 MOCA 서버 발급 opaque access token을 입력합니다.
  parameters:
    YearMonth:
      name: yearMonth
      in: query
      required: false
      description: 집계 기준 월(미전달 시 Asia/Seoul 현재 월)
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: 2026-07
  responses:
    AuthenticationError:
      description: access token이 없거나 유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingToken:
              summary: access token이 없음
              value:
                success: false
                data: null
                error:
                  code: AUTHENTICATION_REQUIRED
                  message: 인증이 필요합니다.
                  fields: {}
            invalidToken:
              summary: access token이 만료되었거나 유효하지 않음
              value:
                success: false
                data: null
                error:
                  code: INVALID_TOKEN
                  message: 유효하지 않거나 만료된 토큰입니다.
                  fields: {}
    AuthorizationError:
      description: 인증은 완료됐지만 해당 리소스 권한이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: ACCESS_DENIED
              message: 접근 권한이 없습니다.
              fields: {}
    ValidationError:
      description: 요청값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HomeDataNotFound:
      description: 홈 화면에 표시할 데이터가 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CodefUnavailableError:
      description: >-
        CODEF 상류 타임아웃·연결 실패·비2xx 응답으로 처리하지 못함(재시도 가능, code=CODEF_UNAVAILABLE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    KakaoUnavailableError:
      description: >-
        카카오맵 상류 타임아웃·연결 실패·비2xx 응답으로 처리하지 못함(재시도 가능, code=KAKAO_UNAVAILABLE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MerchantCategoryNotFound:
      description: 존재하지 않거나 지도 대상이 아닌 categoryId(code=MERCHANT_CATEGORY_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CardSyncFailedError:
      description: >-
        승인내역 또는 실적조회 CODEF 호출 자체가 실패해 전체 동기화를 중단함(재시도 가능). code로
        원인을 구분한다. APPROVAL_SYNC_FAILED(CODEF 승인내역 조회 실패),
        PERFORMANCE_SYNC_FAILED(CODEF 실적조회 호출 실패). 카드사 실적조회 미지원·조회 가능 범위
        초과처럼 재시도해도 항상 실패하는 영구 조건은 이 응답이 아니라 400(code=PERFORMANCE_UNSUPPORTED)
        으로 응답한다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LogoutRequest:
      description: 로그아웃과 함께 해제할 FCM 디바이스 토큰을 선택적으로 전달합니다.
      type: object
      properties:
        fcmToken:
          type: string
          maxLength: 2048
          description: |
            로그아웃하는 기기의 Firebase 디바이스 토큰입니다. 생략하면 세션 폐기만 수행하고 디바이스 매핑은
            비활성화하지 않습니다.
    RegisterDeviceRequest:
      description: 인증 사용자에게 연결할 Firebase Cloud Messaging 디바이스 정보입니다.
      type: object
      required: [fcmToken, deviceType]
      properties:
        fcmToken:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '.*\S.*'
          description: Firebase가 발급한 원문 디바이스 토큰이며 로그에 기록하지 않습니다.
        deviceType:
          type: string
          enum: [WEB, ANDROID, IOS]
          description: 토큰이 발급된 클라이언트 플랫폼입니다.
    DeviceApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/DeviceResponse' }
    DeviceResponse:
      type: object
      required: [userDeviceId, deviceType, active]
      properties:
        userDeviceId: { type: string, format: uuid }
        deviceType: { type: string, enum: [WEB, ANDROID, IOS] }
        active: { type: boolean }
    UpdateLocationRequest:
      description: 위치 기반 알림에 사용할 WGS84 최근 좌표입니다.
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, description: WGS84 위도입니다. }
        longitude: { type: number, minimum: -180, maximum: 180, description: WGS84 경도입니다. }
    BooleanApiResponse:
      description: Boolean 결과를 반환하는 공통 성공 응답입니다.
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { type: boolean, example: true }
    MerchantCategoriesApiResponse:
      description: 'MerchantCategories API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          type: array
          items:
            $ref: '#/components/schemas/MerchantCategoryResponse'
    MerchantCategoryResponse:
      description: '가맹점 분류에 사용하는 카테고리 정보입니다.'
      type: object
      required: [categoryId, categoryCode, categoryName]
      properties:
        categoryId:
          description: '가맹점 카테고리 식별자입니다.'
          type: string
        categoryCode:
          description: '서비스 내부에서 사용하는 가맹점 카테고리 코드입니다.'
          type: string
          example: CAFE
        categoryName:
          description: '화면에 표시할 가맹점 카테고리명입니다.'
          type: string
          example: 카페
    MerchantsApiResponse:
      description: 'Merchants API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          type: array
          items:
            $ref: '#/components/schemas/MerchantResponse'
    MerchantResponse:
      description: '내부에 등록된 가맹점 또는 브랜드 정보입니다.'
      type: object
      required: [merchantId, name]
      properties:
        merchantId:
          description: '가맹점 또는 브랜드 식별자입니다.'
          type: string
        name:
          description: '화면에 표시할 이름입니다.'
          type: string
          example: 스타벅스
    NearbyMerchantsApiResponse:
      description: 'NearbyMerchants API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          type: array
          items:
            $ref: '#/components/schemas/NearbyMerchantResponse'
    NearbyMerchantResponse:
      description: '검색 반경 안에서 확인된 가맹점 위치 정보입니다.'
      type: object
      required: [merchantId, name, latitude, longitude]
      properties:
        merchantId:
          description: '가맹점 또는 브랜드 식별자입니다.'
          type: string
        name:
          type: string
          description: '카카오맵이 내려준 지점명 그대로입니다(예: "강남점" 포함). 브랜드명만 필요하면 merchantId로 조회하세요.'
          example: 스타벅스 강남점
        latitude:
          description: '가맹점 위치의 위도(WGS84)입니다.'
          type: number
          format: double
        longitude:
          description: '가맹점 위치의 경도(WGS84)입니다.'
          type: number
          format: double
        distanceMeters:
          description: '검색 중심점에서 가맹점까지의 거리입니다. 단위는 미터이며 계산할 수 없으면 null입니다.'
          type: integer
          nullable: true
        address:
          description: '도로명 주소가 있으면 그 값, 없으면 지번 주소입니다. 카카오맵이 주소를 못 준 경우 null입니다.'
          type: string
          nullable: true
          example: 서울 강남구 테헤란로 123
    MerchantCardRecommendationApiResponse:
      description: '가맹점별 카드 추천 API의 공통 성공 응답입니다.'
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/MerchantCardRecommendationResponse' }
    MerchantCardRecommendationBatchApiResponse:
      description: '가맹점 목록용 카드 추천 일괄 API의 공통 성공 응답입니다.'
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/MerchantCardRecommendationBatchResponse' }
    MerchantCardRecommendationBatchResponse:
      type: object
      required: [recommendations]
      properties:
        recommendations:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MerchantCardRecommendationResponse' }
    MerchantCardRecommendationResponse:
      description: '가맹점 정보·대표 추천·보유 카드 전체 순위를 묶은 결과입니다.'
      type: object
      required: [merchant, benefitPreferenceType, recommendationAvailable, rankedCards]
      properties:
        merchant: { $ref: '#/components/schemas/MerchantSummaryResponse' }
        benefitPreferenceType:
          $ref: '#/components/schemas/BenefitPreferenceType'
        recommendedCard:
          description: '1위 카드입니다. 적용 가능한 보유 카드가 없으면 null입니다.'
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RankedCardBenefitResponse' }]
        recommendationAvailable:
          type: boolean
          description: '추천 가능한 활성 보유 카드가 한 장 이상 있는지 나타냅니다.'
        rankedCards:
          description: '가맹점 대상 혜택이 있는 활성 보유 카드 순위이며 없으면 빈 배열입니다.'
          type: array
          items: { $ref: '#/components/schemas/RankedCardBenefitResponse' }
    MerchantSummaryResponse:
      type: object
      required: [merchantId, name, categoryCode, categoryName]
      properties:
        merchantId: { type: string, nullable: true, description: '내부 가맹점 식별자이며 장소 추정 결과는 null일 수 있습니다.' }
        name: { type: string, nullable: true, description: '가맹점 또는 브랜드 표시명이며 알 수 없는 식별자는 null입니다.' }
        categoryCode: { type: string, nullable: true, description: '혜택 대상 매칭에 사용한 내부 카테고리 코드입니다.' }
        categoryName: { type: string, nullable: true, description: '화면에 표시할 카테고리명입니다.' }
    RankedCardBenefitResponse:
      type: object
      required: [rank, userCardId, cardName, benefitTitle, rewardType, rewardUnit, rewardValue,
                 estimatedValueKrw, estimatedPaymentAmountKrw, previousMonthSpendKrw,
                 remainingPreviousSpendKrw, isCurrentTierAchieved, remainingAmountToNextTier,
                 monthlyUsedKrw, performanceMet, recommendationReasons, tiers]
      properties:
        rank: { type: integer, minimum: 1, description: '온보딩 혜택 성향을 반영한 1부터 시작하는 순위입니다.' }
        userCardId: { type: string, description: '인증 사용자의 보유 카드 식별자입니다.' }
        cardName: { type: string, description: '카드 상품명입니다.' }
        issuerName: { type: string, description: '카드사명입니다.' }
        cardImageUrl: { type: string, nullable: true, description: '카드 이미지 URL이며 없으면 null입니다.' }
        benefitTitle: { type: string, description: '순위 계산에 사용한 구조화 혜택명입니다.' }
        rewardType: { type: string, description: 'discount, cashback, points, rebate 중 혜택 종류입니다.' }
        rewardUnit: { type: string, enum: [percent, KRW, point, mile], description: '혜택 원 단위입니다.' }
        rewardValue: { type: number, description: '혜택 원 단위 기준 값입니다.' }
        estimatedValueKrw: { type: number, description: '결제금액과 환산 정책으로 계산한 예상 원화 가치입니다.' }
        estimatedPaymentAmountKrw: { type: number, description: '예상 혜택 계산에 사용한 결제 기준 금액입니다.' }
        transactionMinKrw: { type: number, nullable: true, description: '혜택 적용 최소 결제금액이며 없으면 null입니다.' }
        previousMonthSpendKrw: { type: number, description: '전월 인정 실적 원화 금액이며 자료가 없으면 0입니다.' }
        requiredPreviousSpendKrw: { type: number, nullable: true, description: '혜택 적용에 필요한 전월 실적이며 없으면 null입니다.' }
        remainingPreviousSpendKrw: { type: number, description: '혜택 실적 조건까지 추가로 필요한 금액이며 이미 충족했거나 조건이 없으면 0입니다.' }
        currentTier:
          type: integer
          minimum: 1
          nullable: true
          description: '이 가맹점 혜택에 매칭된 offer 안에서 선택된 룰의 전월 실적 구간 번호입니다. 실적 조건이 없으면 null입니다.'
        nextTier:
          type: integer
          minimum: 1
          nullable: true
          description: '동일 가맹점 혜택 offer에서 현재 구간 다음의 전월 실적 구간 번호입니다. 최고 구간 또는 실적 조건이 없으면 null입니다.'
        currentTierTargetAmount:
          type: number
          nullable: true
          description: '현재 가맹점 혜택 구간의 전월 실적 목표 금액입니다. 단위는 원이며 실적 조건이 없으면 null입니다.'
        isCurrentTierAchieved:
          type: boolean
          description: '현재 가맹점 혜택 구간의 전월 실적 목표를 충족했는지 여부입니다. 실적 조건이 없으면 true입니다.'
        remainingAmountToNextTier:
          type: number
          description: >-
            현재 가맹점 혜택 구간을 아직 달성하지 않았다면 그 구간까지, 이미 달성했다면 동일 offer의
            다음 구간까지 남은 전월 실적 금액입니다. 다음 구간이나 실적 조건이 없으면 0입니다. 단위는 원입니다.
        monthlyLimitKrw: { type: number, nullable: true, description: '확인 가능한 원화 월 혜택 한도이며 없거나 계산할 수 없으면 null입니다.' }
        monthlyUsedKrw: { type: number, description: '현재 월에 확정 사용한 해당 혜택 금액입니다.' }
        monthlyRemainingKrw: { type: number, nullable: true, description: '확인 가능한 월 잔여 혜택이며 한도를 계산할 수 없으면 null입니다.' }
        performanceMet: { type: boolean, description: '현재 저장된 전월 실적으로 혜택 조건을 충족하는지 여부입니다.' }
        recommendationReasons:
          type: array
          description: '프론트가 추천 이유 문구를 조합할 수 있는 구조화 근거입니다.'
          items: { $ref: '#/components/schemas/RecommendationReasonResponse' }
        tiers:
          type: array
          description: '현재 혜택 offer에 연결된 전체 실적 구간입니다. 현재 실적과 무관하게 미달성 다음 구간도 포함합니다.'
          items:
            $ref: '#/components/schemas/BenefitTierResponse'
    BenefitTierResponse:
      type: object
      required: [tier, requiredPreviousSpendKrw, monthlyLimitKrw]
      properties:
        tier: { type: integer, minimum: 1, description: '실적 구간 순서입니다.' }
        requiredPreviousSpendKrw: { type: number, format: double, description: '구간 달성에 필요한 전월 실적입니다. 단위는 원입니다.' }
        monthlyLimitKrw: { type: number, format: double, description: '해당 실적 구간의 원화 월 한도입니다.' }
    RecommendationReasonResponse:
      type: object
      required: [code, satisfied]
      properties:
        code:
          type: string
          enum: [MERCHANT_BENEFIT_MATCHED, PREVIOUS_SPEND, MINIMUM_PAYMENT, MONTHLY_LIMIT]
        satisfied: { type: boolean, description: '현재 확인 가능한 데이터 기준 조건 충족 여부입니다.' }
        currentValue: { type: number, nullable: true, description: '현재 값이며 확인할 수 없으면 null입니다.' }
        requiredValue: { type: number, nullable: true, description: '조건 기준값이며 조건이 없으면 null입니다.' }
        remainingValue: { type: number, nullable: true, description: '조건까지 남은 값이며 계산할 수 없으면 null입니다.' }
    HomeGreetingApiResponse:
      description: '홈 인사와 미사용 월 혜택 한도 조회의 공통 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/HomeGreetingResponse'
    HomeGreetingResponse:
      description: '홈 상단 인사말과 기준 월의 미사용 월 혜택 한도 요약입니다.'
      type: object
      required: [nickname, yearMonth, missedBenefitAmount, message]
      properties:
        nickname:
          description: '사용자에게 표시할 닉네임입니다.'
          type: string
        yearMonth:
          description: '집계 기준 월입니다. 형식은 YYYY-MM입니다.'
          type: string
          example: 2026-07
        missedBenefitAmount:
          description: '전월 실적과 카드 옵션에 따라 적용 가능한 월 한도에서 확정 사용액을 차감한 잔여액 합계입니다. 단위는 원입니다.'
          type: integer
          format: int64
        message:
          description: '화면에 표시할 안내 문구입니다.'
          type: string
    HomeCardsApiResponse:
      description: 홈 보유 카드 캐러셀 조회의 공통 응답 envelope입니다.
      type: object
      properties:
        success:
          description: 요청 처리 성공 여부입니다.
          type: boolean
          example: true
        data:
          description: 집계 기준 월과 보유 카드 캐러셀 데이터입니다.
          $ref: '#/components/schemas/HomeCardsResponse'
    HomeCardsResponse:
      description: 홈 화면에서 카드 캐러셀을 구성하는 데이터입니다.
      type: object
      required: [yearMonth, orderMode, cards]
      properties:
        yearMonth:
          description: 카드 혜택·실적을 집계한 기준 월(YYYY-MM)입니다.
          type: string
        orderMode:
          description: 응답 cards 배열에 적용된 정렬 방식입니다. AUTO는 추천 순서, MANUAL은 사용자 지정 순서입니다.
          type: string
          enum: [AUTO, MANUAL]
        selectedUserCardId:
          description: 홈에서 현재 선택된 보유카드 식별자입니다. 선택된 카드가 없으면 null입니다.
          type: string
          format: uuid
          nullable: true
        cards:
          description: 정렬된 보유 카드 캐러셀 항목입니다. 보유 카드가 없으면 빈 배열입니다.
          type: array
          items:
            $ref: '#/components/schemas/HomeCardResponse'
    HomeCardResponse:
      description: 홈 카드 캐러셀의 보유 카드 한 장과 해당 월의 요약 정보입니다.
      type: object
      required: [userCardId, order, cardName, alias, cardImageUrl, highlightBenefit, summary]
      properties:
        userCardId:
          description: 사용자가 등록한 보유카드의 식별자입니다.
          type: string
          format: uuid
        order:
          description: cards 배열에서의 표시 순서입니다.
          type: integer
        cardName:
          description: 카드 상품명입니다.
          type: string
        alias:
          description: 사용자가 지정한 카드 별칭입니다. 지정하지 않으면 null입니다.
          type: string
          nullable: true
        cardImageUrl:
          description: 카드 이미지 URL입니다. 이미지가 없으면 null입니다.
          type: string
          nullable: true
        autoOrderReason:
          description: AUTO 정렬일 때 서버가 계산한 우선순위 사유입니다. MANUAL 정렬이면 null입니다.
          type: string
          nullable: true
        highlightBenefit:
          description: 홈 카드에 강조 표시할 대표 혜택입니다.
          $ref: '#/components/schemas/HomeBenefitHighlightResponse'
        summary:
          description: 집계 기준 월의 혜택·실적 요약입니다.
          $ref: '#/components/schemas/HomeCardSummaryResponse'
    HomeBenefitHighlightResponse:
      description: 카드 캐러셀에 노출할 대표 혜택 문구입니다.
      type: object
      properties:
        title:
          description: 대표 혜택의 제목입니다. 강조할 혜택이 없으면 null입니다.
          type: string
          nullable: true
        monthlyLimitText:
          description: >-
            카드에 적용되는 월 한도를 원화로 환산한 안내 문구입니다. 원화 혜택 한도와
            정액 할인·캐시백의 월 이용 횟수 한도를 합산하며, 같은 통합 한도 그룹은 한 번만
            반영합니다. 한도가 없거나 원화로 환산할 수 없으면 null입니다.
          type: string
          nullable: true
    HomeCardSummaryResponse:
      description: 보유 카드 한 장의 혜택 수령·잠재 혜택·실적 달성 현황입니다. 금액 단위는 원입니다.
      type: object
      required: [receivedBenefitAmount, availableBenefitAmount, maximumMonthlyBenefitAmount,
                 performanceCurrentAmount, performanceTargetAmount, performanceRate,
                 performanceRemainingAmount]
      properties:
        receivedBenefitAmount:
          description: 기준 월에 확정된 혜택 수령 금액입니다.
          type: integer
          format: int64
        availableBenefitAmount:
          description: >-
            기준 월에 추가로 받을 수 있다고 계산된 예상 혜택 금액입니다.
            maximumMonthlyBenefitAmount에서 receivedBenefitAmount를 뺀 값이며, 계산 결과가
            음수이거나 환산 가능한 한도가 없으면 0을 반환합니다.
          type: integer
          format: int64
        maximumMonthlyBenefitAmount:
          description: >-
            기준 월의 전월 실적 구간에 적용되는 카드 전체 월 한도의 원화 합계입니다.
            원화 혜택 한도와 정액 할인·캐시백의 월 이용 횟수 한도를 합산하고 같은 통합 한도
            그룹은 한 번만 반영합니다. 한도가 없거나 원화로 환산할 수 없는 한도만 있으면
            0을 반환합니다.
          type: integer
          format: int64
        performanceCurrentAmount:
          description: 기준 월의 현재 인정 실적 금액입니다.
          type: integer
          format: int64
        performanceTargetAmount:
          description: 현재 실적 구간 달성에 필요한 목표 인정 실적 금액입니다.
          type: integer
          format: int64
        performanceRate:
          description: 목표 실적 대비 현재 인정 실적의 달성률(정수 백분율)입니다.
          type: integer
        performanceRemainingAmount:
          description: 목표 실적까지 남은 인정 실적 금액입니다. 이미 달성했으면 0입니다.
          type: integer
          format: int64
    RecentHistoryApiResponse:
      description: 'RecentHistory API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/RecentHistoryResponse'
    RecentHistoryResponse:
      description: '홈 화면에 표시할 최근 전체 결제 내역입니다.'
      type: object
      required: [history]
      properties:
        history:
          description: '조건에 해당하는 결제 승인 목록입니다. 내역이 없으면 빈 배열입니다.'
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RecentHistoryItemResponse'
    RecentHistoryItemResponse:
      description: '홈에 표시할 최근 결제 승인과 혜택 계산 요약 한 건입니다.'
      type: object
      required: [approvalId, merchantName, cardName, paymentAmount, benefitAmount,
                 missedBenefitAmount, calculationStatus, occurredAt]
      properties:
        approvalId:
          description: '결제 승인 식별자입니다.'
          type: string
        benefitHistoryId:
          description: '대표 혜택 적용 또는 계산 결과 식별자입니다. 계산 내역이 없으면 null입니다.'
          type: string
          nullable: true
        merchantName:
          description: '승인내역에 연결된 가맹점명입니다.'
          type: string
        benefitType:
          description: '혜택 유형입니다. MILEAGE는 마일리지이며, 여러 유형이 함께 있으면 MULTIPLE, 혜택 계산 내역이 없으면 null입니다.'
          type: string
          nullable: true
          enum: [DISCOUNT, CASHBACK, POINT, MILEAGE, MULTIPLE]
        benefitTitle:
          description: '카드 상품 안내에 정의된 혜택명입니다.'
          type: string
          nullable: true
        cardName:
          description: '카드 상품명입니다.'
          type: string
        paymentAmount:
          description: '승인 결제금액입니다. 단위는 원입니다.'
          type: integer
          format: int64
