      required: [success, data]
      properties:
        success: { type: boolean, example: true , description: '요청 처리 성공 여부입니다.'}
        data: { $ref: '#/components/schemas/PerformanceCardsReportResponse' }
    PerformanceCardsReportResponse:
      description: '기준 월의 모든 활성 보유카드 실적 목록입니다.'
      type: object
      required: [yearMonth, cards]
      properties:
        yearMonth: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' , description: '집계 기준 월입니다. 형식은 YYYY-MM입니다.'}
        cards:
          description: '보유카드 목록입니다. 해당 카드가 없으면 빈 배열입니다.'
          type: array
          items: { $ref: '#/components/schemas/PerformanceCardResponse' }
    PerformanceCardResponse:
      description: '보유카드 한 장의 기준 월 실적 달성 현황입니다.'
      type: object
      required: [userCardId, cardName, currentPerformanceAmount, currentTierTargetAmount,
                 achievementRate, currentTier, isCurrentTierAchieved, remainingAmountToNextTier,
                 nextTierTargetAmount, tiers]
      properties:
        userCardId: { type: string, format: uuid , description: 'userCard 리소스의 식별자입니다.'}
        cardName: { type: string , description: '카드 상품명입니다.'}
        cardImageUrl: { type: string, format: uri, nullable: true , description: '카드 이미지 URL입니다. 이미지가 없으면 null입니다.'}
        currentPerformanceAmount: { type: integer, format: int64 , description: '기준 월의 현재 인정 실적 금액입니다. 단위는 원입니다.'}
        currentTierTargetAmount: { type: integer, format: int64, description: '현재 달성한 currentTier의 기준 금액입니다. 첫 구간 미달이면 0입니다.' }
        achievementRate: { type: integer, minimum: 0, maximum: 100 , description: 'nextTier가 있으면 nextTier 목표, 없으면 currentTier 목표를 기준으로 한 진행률입니다. 단위는 정수 백분율입니다.'}
        currentTier: { type: integer, minimum: 0, description: 현재 실적이 속한 카드 콘텐츠 실적 구간 번호이며, 구간 데이터가 없거나 첫 구간 미만이면 0 }
        nextTier: { type: integer, nullable: true, description: 다음으로 달성할 카드 콘텐츠 실적 구간 번호이며, 최고 구간이면 null }
        nextTierTargetAmount: { type: integer, format: int64, nullable: true, description: 'nextTier를 달성하기 위한 기준 금액이며, 다음 구간이 없으면 null입니다.' }
        isCurrentTierAchieved: { type: boolean , description: 'currentTier가 실제로 달성된 상태인지 여부입니다. 첫 구간 미달이면 false입니다.'}
        remainingAmountToNextTier: { type: integer, format: int64 , description: '다음 실적 구간까지 필요한 금액입니다. 단위는 원입니다.'}
        tiers:
          type: array
          description: '카드 콘텐츠에 정의된 전체 실적 구간입니다. 각 targetAmount는 해당 구간 시작 금액이며 구간 정보가 없으면 빈 배열입니다.'
          items: { $ref: '#/components/schemas/PerformanceTierResponse' }
    PerformanceTierResponse:
      description: '카드의 월 실적 구간입니다.'
      type: object
      required: [tier, targetAmount]
      properties:
        tier: { type: integer, minimum: 1, description: '실적 구간 번호입니다.' }
        targetAmount: { type: integer, format: int64, minimum: 0, description: '실적 구간 시작 금액입니다. 단위는 원입니다.' }
    CardLinkApiResponse:
      description: 'CardLink API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/CardLinkResponse'
    CardLinkResponse:
      description: 'CODEF 카드사 계정 연동 결과와 조회된 보유카드 목록입니다.'
      type: object
      required: [linkId, institutionCode, status, cards]
      properties:
        linkId:
          type: string
          format: uuid
          description: >-
            이번 연동 한 건(카드사 계정 자격정보, codef_account_credential_id)의 식별자.
            PATCH /card-links/{linkId}/cards의 경로 파라미터로 사용합니다.
        institutionCode:
          type: string
          description: 카드사 기관코드(issuers.institution_code)
          example: "0301"
        status:
          description: '카드 연동 처리 상태입니다. PENDING_CARD_ACTIVATION은 조회된 카드의 활성화 선택이 필요함을 뜻합니다.'
          type: string
          enum: [PENDING_CARD_ACTIVATION]
        cards:
          description: '보유카드 목록입니다. 해당 카드가 없으면 빈 배열입니다.'
          type: array
          items:
            $ref: '#/components/schemas/CardLinkCardResponse'
    CardLinkCardResponse:
      description: 'CODEF에서 조회하고 내부 카탈로그와 매칭한 보유카드 정보입니다.'
      type: object
      required: [userCardId, cardName, cardNo, institutionCode, issuerName, cardType, cardImageUrl,
                 matched, supported, optionGroups]
      properties:
        userCardId:
          type: string
          format: uuid
          nullable: true
          description: 매칭 성공 카드만 is_active=false로 적재되어 값이 있고, 미매칭 카드는 null입니다.
        cardId:
          description: 'card 리소스의 식별자입니다.'
          type: string
          format: uuid
          nullable: true
        cardName:
          description: '카드 상품명입니다.'
          type: string
        cardNo:
          type: string
          nullable: true
          description: CODEF resCardNo(마스킹된 카드번호, 예 "943646******1069")
          example: "943646******1069"
        institutionCode:
          type: string
          description: 카드사 기관코드(issuers.institution_code)
        issuerName:
          description: '카드 발급사명입니다.'
          type: string
        cardType:
          description: '카드 유형입니다. CREDIT은 신용카드, CHECK는 체크카드, UNKNOWN은 확인 불가입니다.'
          type: string
          enum: [CREDIT, CHECK, UNKNOWN]
        cardImageUrl:
          type: string
          nullable: true
          description: 카드고릴라 이미지 → 미매칭 시 CODEF 이미지 순. 둘 다 없으면 null이며 기본 이미지는 프론트가 처리합니다.
        matched:
          description: 'CODEF 카드가 내부 카드 카탈로그와 매칭되었는지 여부입니다.'
          type: boolean
        supported:
          type: boolean
          description: false이면 추천 계산에서 제외합니다.
        optionGroups:
          description: '카드 활성화 전에 선택해야 하는 옵션 그룹 목록입니다.'
          type: array
          items:
            $ref: '#/components/schemas/CardOptionGroupResponse'
    CardOptionGroupResponse:
      description: '카드 활성화 전에 선택해야 하는 옵션 그룹입니다.'
      type: object
      required: [optionGroupId, groupKey, groupName, choices]
      properties:
        optionGroupId:
          description: 'optionGroup 리소스의 식별자입니다.'
          type: string
          format: uuid
        groupKey:
          description: '옵션 그룹을 구분하는 내부 키입니다.'
          type: string
        groupName:
          description: '화면에 표시할 옵션 그룹명입니다.'
          type: string
        choices:
          description: '옵션 그룹에서 선택할 수 있는 항목 목록입니다.'
          type: array
          items:
            $ref: '#/components/schemas/CardOptionChoiceResponse'
    CardOptionChoiceResponse:
      description: '카드 옵션 그룹에서 선택할 수 있는 항목입니다.'
      type: object
      required: [optionChoiceId, choiceKey, choiceName]
      properties:
        optionChoiceId:
          description: 'optionChoice 리소스의 식별자입니다.'
          type: string
          format: uuid
        choiceKey:
          description: '옵션 선택지를 구분하는 내부 키입니다.'
          type: string
        choiceName:
          description: '화면에 표시할 옵션 선택지명입니다.'
          type: string
    ActivateCardLinkCardsRequest:
      description: '활성화할 보유카드 목록과 선택형 카드의 옵션을 전달하는 요청입니다.'
      type: object
      required: [activeUserCardIds]
      properties:
        activeUserCardIds:
          type: array
          minItems: 1
          description: 활성화할(이미 적재된) user_card_id 목록
          items:
            type: string
            format: uuid
        optionSelections:
          type: array
          description: 선택형 카드의 옵션 선택. 옵션 없는 카드만 활성화하면 생략 가능합니다.
          items:
            type: object
            required: [userCardId]
            properties:
              userCardId:
                description: 옵션을 선택할 보유카드 식별자입니다.
                type: string
                format: uuid
              optionSelections:
                description: 해당 카드에 적용할 옵션 그룹별 선택 목록입니다.
                type: array
                items:
                  type: object
                  required: [optionGroupId, optionChoiceId]
                  properties:
                    optionGroupId:
                      description: 선택할 옵션 그룹의 식별자입니다.
                      type: string
                      format: uuid
                    optionChoiceId:
                      description: 옵션 그룹에서 선택한 항목의 식별자입니다.
                      type: string
                      format: uuid
    SubmitCardCredentialsRequest:
      description: '추가 카드 검증이 필요한 카드의 카드번호와 선택적 비밀번호 입력입니다.'
      type: object
      required: [cardNo]
      properties:
        cardNo:
          type: string
          description: 이 카드의 전체 카드번호. 카드사가 카드번호를 요구할 때만 쓰입니다.
        cardPassword:
          type: string
          description: 카드사 정책상 카드 비밀번호가 필요한 경우에만 필수입니다.
    CardLinkCardApiResponse:
      description: 'CardLinkCard API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/CardLinkCardResponse'
    SyncOwnedCardsApiResponse:
      description: 'SyncOwnedCards API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/SyncOwnedCardsResponse'
    SyncOwnedCardsResponse:
      description: '활성 카드사 계정 연동별 보유카드 재조회 결과입니다.'
      type: object
      required: [results]
      properties:
        results:
          description: '카드사 연동별 동기화 결과 목록입니다.'
          type: array
          items:
            $ref: '#/components/schemas/SyncOwnedCardsResult'
    SyncOwnedCardsResult:
      description: '카드사 계정 연동 한 건의 보유카드 재조회 성공 여부와 카드 목록입니다.'
      type: object
      required: [linkId, institutionCode, success, cards]
      properties:
        linkId:
          type: string
          format: uuid
          description: 이 결과가 속한 연동(codef_account_credential_id)의 식별자
        institutionCode:
          description: 'CODEF에서 사용하는 카드사 기관코드입니다.'
          type: string
          example: "0301"
        success:
          type: boolean
          description: false면 CODEF 조회 자체가 실패해 재시도가 필요합니다. cards가 빈 배열인 것과는 다릅니다.
        cards:
          description: '보유카드 목록입니다. 해당 카드가 없으면 빈 배열입니다.'
          type: array
          items:
            $ref: '#/components/schemas/CardLinkCardResponse'
    ActivateCardLinkCardsApiResponse:
      description: 'ActivateCardLinkCards API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          type: object
          properties:
            linkId:
              description: 활성화 처리를 수행한 카드사 계정 연동 식별자입니다.
              type: string
              format: uuid
            activatedUserCardIds:
              description: 이번 요청에서 활성화된 보유카드 식별자 목록입니다.
              type: array
              items:
                type: string
                format: uuid
            activatedCount:
              description: 이번 요청에서 활성화된 보유카드 수입니다.
              type: integer
    GoogleLoginRequest:
      description: 'Google PKCE 로그인을 완료하기 위한 authorization code와 검증값입니다.'
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code:
          type: string
          description: Google callback에서 받은 authorization code
        codeVerifier:
          type: string
          description: PWA가 PKCE 생성 시 보관한 code verifier
        redirectUri:
          type: string
          format: uri
          description: Google 로그인 요청에 사용한 callback URI
    GoogleLoginApiResponse:
      description: 'GoogleLogin API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/GoogleLoginResponse'
    GoogleLoginResponse:
      description: 'Google 로그인 완료 후 발급한 MOCA 인증 정보입니다.'
      type: object
      properties:
        newMember:
          description: '이번 로그인에서 신규 회원으로 등록되었는지 여부입니다.'
          type: boolean
        accessToken:
          description: 'MOCA API 인증에 사용하는 서버 발급 opaque access token입니다.'
          type: string
        accessTokenExpiresIn:
          description: 'access token 만료까지 남은 시간입니다. 단위는 초입니다.'
          type: integer
          example: 1800
        member:
          description: '로그인한 사용자의 프로필입니다.'
          $ref: '#/components/schemas/UserProfileResponse'
    RefreshTokenApiResponse:
      description: 'RefreshToken API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/RefreshTokenResponse'
    RefreshTokenResponse:
      description: 'refresh token 회전 후 새로 발급한 opaque access token 정보입니다.'
      type: object
      properties:
        accessToken:
          description: 'MOCA API 인증에 사용하는 서버 발급 opaque access token입니다.'
          type: string
        accessTokenExpiresIn:
          description: 'access token 만료까지 남은 시간입니다. 단위는 초입니다.'
          type: integer
          example: 1800
    UserProfileApiResponse:
      description: 'UserProfile API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/UserProfileResponse'
    UserProfileResponse:
      description: '인증 사용자의 프로필과 카드 정렬 설정입니다.'
      type: object
      properties:
        userId:
          description: '인증 사용자의 식별자입니다.'
          type: string
          format: uuid
        nickname:
          description: '사용자에게 표시할 닉네임입니다.'
          type: string
        email:
          description: 'Google 계정 이메일입니다. 제공되지 않으면 null입니다.'
          type: string
          format: email
          nullable: true
        userType:
          description: '사용자 권한 유형입니다.'
          type: string
          enum: [user, admin]
        cardSortMode:
          description: '홈 카드 정렬 방식입니다. AUTO는 서버 추천, MANUAL은 사용자 지정 순서입니다.'
          type: string
          enum: [AUTO, MANUAL]
    MeCardsApiResponse:
      description: 'MeCards API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/MeCardsResponse'
    MeCardsResponse:
      description: '인증 사용자의 활성·비활성 보유카드 목록입니다.'
      type: object
      required: [lastSyncedAt, activeCards]
      properties:
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: CODEF 동기화 시각 출처가 연결되기 전에는 null입니다.
        activeCards:
          description: '현재 활성화된 보유카드 목록입니다.'
          type: array
          items:
            $ref: '#/components/schemas/MeCardItemResponse'
        inactiveCards:
          type: array
          description: includeInactive=false이면 필드 자체를 생략합니다.
          items:
            $ref: '#/components/schemas/MeCardItemResponse'
    SyncMyCardsApiResponse:
      description: 'SyncMyCards API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/SyncMyCardsResponse'
    SyncMyCardsResponse:
      description: '승인내역과 카드 실적 동기화 결과입니다.'
      type: object
      required: [syncedCardCount, syncedApprovalCount, syncedPerformanceCount, syncedAt]
      properties:
        syncedCardCount:
          type: integer
          description: 동기화 대상 보유 카드 수.
          example: 3
        syncedApprovalCount:
          type: integer
          description: 이번 동기화로 새로 적재된 승인내역 건수.
          example: 42
        syncedPerformanceCount:
          type: integer
          description: 이번 동기화로 upsert된 카드 실적 스냅샷 건수.
          example: 3
        syncedAt:
          type: string
          format: date-time
          description: 동기화 완료 시각(KST 오프셋 포함).
          example: "2026-08-03T10:30:00+09:00"
    MeCardItemResponse:
      description: '내 카드 목록에 표시할 보유카드 한 장입니다.'
      type: object
      required: [userCardId, cardName, cardNo, issuerId, issuerName, cardImageUrl, memo]
      properties:
        userCardId:
          description: 'userCard 리소스의 식별자입니다.'
          type: string
          format: uuid
