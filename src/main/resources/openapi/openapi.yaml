        nextTier: { type: integer, nullable: true, description: 다음으로 달성할 카드 콘텐츠 실적 구간 번호이며, 최고 구간이면 null }
        isCurrentTierAchieved: { type: boolean , description: '현재 실적 구간 달성 여부입니다.'}
        remainingAmountToNextTier: { type: integer, format: int64 , description: '다음 실적 구간까지 필요한 금액입니다. 단위는 원입니다.'}
    CardLinkApiResponse:
      description: 'CardLink API의 공통 성공 응답입니다.'
      type: object
      properties:
        success:
          description: '요청 처리 성공 여부입니다.'
          type: boolean
          example: true
        data:
          description: 'API의 실제 처리 결과입니다.'
          $ref: '#/components/schemas/CardLinkResponse'
    CardLinkResponse:
      description: 'CODEF 카드사 계정 연동 결과와 조회된 보유카드 목록입니다.'
      type: object
      required: [linkId, institutionCode, status, cards]
      properties:
        linkId:
          type: string
          format: uuid
          description: >-
            이번 연동 한 건(카드사 계정 자격정보, codef_account_credential_id)의 식별자.
            PATCH /card-links/{linkId}/cards의 경로 파라미터로 사용합니다.
        institutionCode:
          type: string
          description: 카드사 기관코드(issuers.institution_code)
          example: "0301"
        status:
          description: '카드 연동 처리 상태입니다. PENDING_CARD_ACTIVATION은 조회된 카드의 활성화 선택이 필요함을 뜻합니다.'
          type: string
          enum: [PENDING_CARD_ACTIVATION]
        cards:
          description: '보유카드 목록입니다. 해당 카드가 없으면 빈 배열입니다.'
          type: array
          items:
            $ref: '#/components/schemas/CardLinkCardResponse'
    CardLinkCardResponse:
      description: 'CODEF에서 조회하고 내부 카탈로그와 매칭한 보유카드 정보입니다.'
      type: object
      required: [userCardId, cardName, cardNo, institutionCode, issuerName, cardType, cardImageUrl,
                 matched, supported, optionGroups]
      properties:
        userCardId:
          type: string
          format: uuid
          nullable: true
          description: 매칭 성공 카드만 is_active=false로 적재되어 값이 있고, 미매칭 카드는 null입니다.
        cardId:
          description: 'card 리소스의 식별자입니다.'
          type: string
          format: uuid
          nullable: true
        cardName:
          description: '카드 상품명입니다.'
          type: string
        cardNo:
          type: string
          nullable: true
          description: CODEF resCardNo(마스킹된 카드번호, 예 "943646******1069")
          example: "943646******1069"
        institutionCode:
          type: string
          description: 카드사 기관코드(issuers.institution_code)
        issuerName:
          description: '카드 발급사명입니다.'
          type: string
        cardType:
          description: '카드 유형입니다. CREDIT은 신용카드, CHECK는 체크카드, UNKNOWN은 확인 불가입니다.'
          type: string
          enum: [CREDIT, CHECK, UNKNOWN]
        cardImageUrl:
          type: string
          nullable: true
          description: 카드고릴라 이미지 → 미매칭 시 CODEF 이미지 순. 둘 다 없으면 null이며 기본 이미지는 프론트가 처리합니다.
        matched:
          description: 'CODEF 카드가 내부 카드 카탈로그와 매칭되었는지 여부입니다.'
          type: boolean
        supported:
          type: boolean
          description: false이면 추천 계산에서 제외합니다.
        optionGroups:
          description: '카드 활성화 전에 선택해야 하는 옵션 그룹 목록입니다.'
          type: array
          items:
            $ref: '#/components/schemas/CardOptionGroupResponse'
    CardOptionGroupResponse:
      description: '카드 활성화 전에 선택해야 하는 옵션 그룹입니다.'
      type: object
      required: [optionGroupId, groupKey, groupName, choices]
      properties:
        optionGroupId:
          description: 'optionGroup 리소스의 식별자입니다.'
          type: string
          format: uuid
        groupKey:
          description: '옵션 그룹을 구분하는 내부 키입니다.'
          type: string
        groupName:
          description: '화면에 표시할 옵션 그룹명입니다.'
          type: string
        choices:
          description: '옵션 그룹에서 선택할 수 있는 항목 목록입니다.'
          type: array
          items:
            $ref: '#/components/schemas/CardOptionChoiceResponse'
    CardOptionChoiceResponse:
      description: '카드 옵션 그룹에서 선택할 수 있는 항목입니다.'
      type: object
      required: [optionChoiceId, choiceKey, choiceName]
      properties:
        optionChoiceId:
          description: 'optionChoice 리소스의 식별자입니다.'
          type: string
          format: uuid
        choiceKey:
          description: '옵션 선택지를 구분하는 내부 키입니다.'
          type: string
        choiceName:
          description: '화면에 표시할 옵션 선택지명입니다.'
          type: string
    ActivateCardLinkCardsRequest:
      description: '활성화할 보유카드 목록과 선택형 카드의 옵션을 전달하는 요청입니다.'
      type: object
      required: [activeUserCardIds]
      properties:
        activeUserCardIds:
          type: array
          minItems: 1
          description: 활성화할(이미 적재된) user_card_id 목록
          items:
            type: string
            format: uuid
        optionSelections:
          type: array
          description: 선택형 카드의 옵션 선택. 옵션 없는 카드만 활성화하면 생략 가능합니다.
          items:
            type: object
            required: [userCardId]
            properties:
              userCardId:
                description: 옵션을 선택할 보유카드 식별자입니다.
                type: string
                format: uuid
              optionSelections:
                description: 해당 카드에 적용할 옵션 그룹별 선택 목록입니다.
                type: array
                items:
                  type: object
                  required: [optionGroupId, optionChoiceId]
                  properties:
                    optionGroupId:
                      description: 선택할 옵션 그룹의 식별자입니다.
                      type: string
                      format: uuid
                    optionChoiceId:
                      description: 옵션 그룹에서 선택한 항목의 식별자입니다.
                      type: string
                      format: uuid
    SubmitCardCredentialsRequest:
      description: '추가 카드 검증이 필요한 카드의 카드번호와 선택적 비밀번호 입력입니다.'
      type: object
      required: [cardNo]
      properties:
        cardNo:
          type: string
          description: 이 카드의 전체 카드번호. 카드사가 카드번호를 요구할 때만 쓰입니다.
        cardPassword:
          type: string
          description: 카드사 정책상 카드 비밀번호가 필요한 경우에만 필수입니다.
    CardLinkCardApiResponse:
      description: 'CardLinkCard API의 공통 성공 응답입니다.'
