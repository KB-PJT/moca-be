openapi: 3.0.3
info:
  title: MOCA Backend API
  description: |
    결제 전 최적 카드 추천을 위한 MOCA Backend REST API입니다.

    Google PKCE 로그인은 PWA가 authorization code를 받은 뒤 MOCA 서버가 Client Secret으로 교환합니다.
    이후 MOCA API는 서버가 발급한 opaque access token으로 인증합니다.
  version: 1.0.0
servers:
  - url: /api/v1
    description: MOCA API v1
tags:
  - name: Auth
    description: Google authorization code 검증 및 MOCA opaque 세션 관리
  - name: User
    description: 인증 사용자 프로필과 개인 설정 관리
  - name: Card
    description: 인증 사용자의 보유 카드 관리
  - name: CardLink
    description: CODEF 연동과 보유 카드 선택 등록
  - name: Home
    description: 인증 사용자의 홈 화면 컴포넌트 조회
  - name: Health
    description: 서버 상태 확인
paths:
  /health:
    get:
      tags: [Health]
      summary: 서버 상태 조회
      description: 인증 없이 사용할 수 있는 상태 확인 API입니다.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 서버가 정상 동작 중임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /home/greeting:
    get:
      tags: [Home]
      summary: 홈 인사와 놓친 혜택 조회
      operationId: getHomeGreeting
      security:
        - MocaBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/YearMonth'
      responses:
        '200':
          description: 홈 상단 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeGreetingApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/HomeDataNotFound'
  /home/cards:
    get:
      tags: [Home]
      summary: 홈 보유 카드 캐러셀 조회
      operationId: getHomeCards
      security:
        - MocaBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/YearMonth'
        - name: orderMode
          in: query
          required: false
          description: 미전달 시 사용자가 저장한 정렬 방식을 사용합니다.
          schema:
            type: string
            enum: [AUTO, MANUAL]
      responses:
        '200':
          description: 보유 카드와 당월 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeCardsApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/HomeDataNotFound'
  /home/recent-benefits:
    get:
      tags: [Home]
      summary: 홈 최근 혜택 내역 조회
      operationId: getHomeRecentBenefits
      security:
        - MocaBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/YearMonth'
        - name: limit
          in: query
          required: false
          description: 반환할 내역 수(1~5)
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 5
      responses:
        '200':
          description: 최근 혜택 내역
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentBenefitsApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/HomeDataNotFound'
  /card-links:
    post:
      tags: [CardLink]
      summary: CODEF 카드 연동(Connected ID) 생성
      description: |
        카드사 자격정보로 CODEF Connected ID를 생성하고 보유카드를 조회합니다.
        비밀번호는 CODEF 공개키로 RSA 암호화해 전송하며, 저장 시 자격정보는 AES로 암호화합니다.
        반환된 카드는 후보이며 아직 user_cards에 적재되지 않습니다. matched=false 카드는 추천에서 제외됩니다.
        옵션 그룹은 파서 검증이 완료된 항목만 반환하며, 선택 카드 확정 시 그룹마다 하나를 골라야 합니다.
        connectedId 발급 이후 자격정보는 먼저 저장되므로, 뒤이은 보유카드 조회가 실패해도 연동 생성
        자체는 201로 성공하고 cards는 빈 배열로 내려갑니다. 이 경우 POST /card-links/cards/sync로
        보유카드만 다시 조회할 수 있습니다.
      operationId: createCardLink
      security:
        - MocaBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institutionCode]
              properties:
                institutionCode:
                  type: string
                  description: 카드사 기관코드(issuers.institution_code, 예 "0301"). 서버가 내부 issuer_id로 변환합니다.
                  example: "0301"
                id:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
                password:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
                cardNo:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
                cardPassword:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
                birthDate:
                  type: string
                  description: 카드사 정책에 따라 필수입니다.
      responses:
        '201':
          description: 연동 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLinkApiResponse'
        '400':
          description: >-
            요청값 검증 실패(code=VALIDATION_FAILED), 카드사 필수 자격정보 누락
            (code=CODEF_CREDENTIAL_REQUIRED), 또는 카드사 로그인 아이디·비밀번호 오류
            (code=CODEF_INVALID_CREDENTIALS — 재시도 안내가 아니라 정보를 다시 확인하라는 뜻입니다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 등록되지 않은 발급사
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 연동된 카드사 계정 또는 카드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: >-
            카드사 비밀번호 오류 횟수 초과로 계정이 잠김(code=CODEF_ACCOUNT_LOCKED). 재시도 안내가 아니라
            카드사를 통한 잠금 해제가 필요하다는 뜻입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/CodefUnavailableError'
  /card-links/{linkId}/cards:
    patch:
      tags: [CardLink]
      summary: 적재된 보유카드 활성화 및 옵션 선택
      description: 이미 적재된(비활성) 보유카드 중 지정한 카드를 활성화하고 선택형 카드의 옵션을 저장합니다. 신규 카드 적재나 원본 데이터 로딩은 하지 않습니다.
      operationId: activateCardLinkCards
      security:
        - MocaBearerAuth: []
      parameters:
        - name: linkId
          in: path
          required: true
          description: >-
            연동 한 건(= 카드사 계정 자격정보)의 식별자로, codef_account_credential_id와 같습니다.
            POST /card-links 응답의 linkId를 그대로 사용하며, 이 연동으로 적재된 user_cards만 활성화 대상이 됩니다.
            (개별 카드 식별자 userCardId와는 다릅니다.)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateCardLinkCardsRequest'
      responses:
        '200':
          description: 활성화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateCardLinkCardsApiResponse'
        '400':
          description: >-
            요청값 검증 실패(code=VALIDATION_FAILED), 연동에 속하지 않은 카드·옵션 오류
            (code=INVALID_CARD_SELECTION), 또는 카드사가 요구하는 카드번호/비밀번호가 이 카드에
            저장돼 있지 않음(code=CARD_CREDENTIAL_REQUIRED — PATCH /card-links/cards/{userCardId}/credentials로
            먼저 채워야 합니다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: 본인 소유의 미확정 연동을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /card-links/cards/sync:
    post:
      tags: [CardLink]
      summary: 보유카드 재조회
      description: |
        사용자의 활성 CODEF 연동(카드사 계정)별로 보유카드를 다시 조회해 새로 매칭된 카드만 추가로
        적재합니다. institutionCode를 주면 그 카드사 연동만, 생략하면 모든 활성 연동을 대상으로 합니다.
        이미 적재된 카드는 다시 적재하지 않고 기존 카드를 그대로 응답합니다.
        연동 하나가 CODEF 조회 자체에 실패하면 그 연동만 success=false로 응답하고 다른 연동에는
        영향을 주지 않습니다(전체 요청은 200). 정상 조회했지만 매칭된 카드가 0건인 경우는 실패가
        아니라 success=true에 cards가 빈 배열로 내려갑니다.
      operationId: syncOwnedCards
      security:
        - MocaBearerAuth: []
      parameters:
        - name: institutionCode
          in: query
          required: false
          description: 카드사 기관코드(issuers.institution_code). 생략하면 모든 활성 연동을 재조회합니다.
          schema:
            type: string
            example: "0301"
      responses:
        '200':
          description: 재조회 성공(연동별 결과 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncOwnedCardsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: 지정한 기관코드로 연동된 활성 계정이 없음(code=CODEF_CONNECTION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /card-links/cards/{userCardId}/credentials:
    patch:
      tags: [CardLink]
      summary: 카드별 카드번호/비밀번호 추가 입력
      description: |
        카드번호가 필요한 카드사에서, 계정 생성 시 입력한 카드와 일치하지 않아 카드번호/비밀번호가
        비어 있는 보유카드에 값을 채웁니다. 입력한 카드번호/비밀번호로 그 카드사 connectedId와 함께
        보유카드 조회를 호출해 정상 응답을 받으면 유효한 것으로 보고 암호화해 저장합니다.
        이 요청만으로는 카드가 활성화되지 않습니다(is_active는 그대로 false). 응답은 옵션 그룹을
        포함한 카드 정보이며, 옵션이 있으면 골라서 PATCH /card-links/{linkId}/cards로 별도
        활성화해야 합니다(활성화 경로를 하나로 유지해 옵션 검증을 항상 거치게 하기 위함입니다).
      operationId: submitCardCredentials
      security:
        - MocaBearerAuth: []
      parameters:
        - name: userCardId
          in: path
          required: true
          description: 카드정보를 채울 보유카드(user_cards)의 식별자
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCardCredentialsRequest'
      responses:
        '200':
          description: 저장 성공(옵션 그룹을 포함한 카드 정보 반환, 활성화는 별도 요청 필요)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLinkCardApiResponse'
        '400':
          description: >-
            요청값 검증 실패(code=VALIDATION_FAILED), 카드번호/비밀번호 누락
            (code=CARD_CREDENTIAL_REQUIRED), 이 카드사는 카드번호가 필요하지 않음
            (code=INVALID_CARD_SELECTION), 또는 입력한 카드번호가 이 카드의 저장된 마스킹
            카드번호(앞·뒤 노출 자리)와 일치하지 않음(code=CARD_NUMBER_MISMATCH — CODEF를
            호출하지 않고 로컬에서 먼저 걸러낸 결과입니다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: 본인 소유의 카드를 찾을 수 없음(code=USER_CARD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/CodefUnavailableError'
  /auth/google/login:
    post:
      tags: [Auth]
      summary: Google authorization code로 MOCA 로그인
      description: |
        PWA는 callback에서 받은 authorization code, code verifier, redirect URI를 전달합니다.
        서버는 Google access token을 교환하고 tokeninfo의 audience, 만료, scope, user_id를 검증합니다.
        PWA는 Google OAuth 요청에 openid, userinfo.email, userinfo.profile scope를 포함해야 하며,
        서버는 UserInfo의 profile name을 신규 회원의 nickname으로 저장합니다.
        refresh token은 JSON이 아닌 HttpOnly cookie로만 반환합니다.
      operationId: loginWithGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLoginApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Google authorization code 또는 access token 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: MOCA access token 갱신
      description: HttpOnly refresh cookie를 사용해 새 access/refresh token을 발급합니다.
      operationId: refreshToken
      security: []
      responses:
        '200':
          description: 갱신 성공
          headers:
            Set-Cookie:
              description: 회전된 HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenApiResponse'
        '401':
          description: refresh cookie가 없거나 만료됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: MOCA 로그아웃
      description: access token 또는 refresh cookie에 연결된 Redis 세션을 폐기합니다.
      operationId: logout
      security: []
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: 만료된 refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessApiResponse'
  /me:
    get:
      tags: [User]
      summary: 내 프로필 조회
      description: MOCA opaque access token이 필요한 인증 사용자 API입니다. 사용자 정보와 연관 설정·탈퇴 이력을 물리 삭제합니다.
      operationId: getMyProfile
      security:
        - MocaBearerAuth: []
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
    delete:
      tags: [User]
      summary: 회원 탈퇴
      description: MOCA opaque access token이 필요한 인증 사용자 API입니다.
      operationId: withdrawMe
      security:
        - MocaBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawUserRequest'
      responses:
        '200':
          description: 탈퇴 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/nickname:
    patch:
      tags: [User]
      summary: 내 닉네임 변경
      operationId: updateMyNickname
      security:
        - MocaBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNicknameRequest'
      responses:
        '200':
          description: 닉네임 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/cards:
    get:
      tags: [Card]
      summary: 내 카드 목록 조회
      description: |
        인증 사용자의 활성 카드와 선택적인 비활성 카드 목록을 반환합니다.
        기존 계약의 이름과 동작이 반대이므로 includeInactive=true이면 활성 카드만 반환합니다.
      operationId: getMyCards
      security:
        - MocaBearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          required: false
          description: false이면 비활성 카드를 포함하고, true이면 활성 카드만 반환합니다.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 내 카드 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeCardsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/cards/sync:
    post:
      tags: [Card]
      summary: 승인내역 동기화
      description: |
        연결된 카드사의 승인내역(거래내역)을 CODEF에서 조회해 새로 발견한 정상 국내 승인건만 중복 없이 적재합니다.
        취소·부분취소·거절 및 해외결제는 적재하지 않습니다.
        startDate/endDate를 생략하면 이번 달 1일부터 오늘까지(KST) 조회합니다.
        또한 카드별 실적현황을 CODEF에서 조회해 인정 실적금액을 최신 값으로 upsert합니다. 실적 조회 대상 월은
        startDate가 속한 달(기본값 이번 달)입니다. 연동 중 하나라도 승인내역 또는 실적조회에 실패하면
        (카드사 실적조회 미지원·조회 가능 범위 초과 포함) 전체 동기화를 실패로 처리하고 503으로 응답합니다.
      operationId: syncMyCardApprovals
      security:
        - MocaBearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: 조회 시작일(KST, YYYY-MM-DD). 생략 시 이번 달 1일.
          schema:
            type: string
            format: date
            example: "2026-08-01"
        - name: endDate
          in: query
          required: false
          description: 조회 종료일(KST, YYYY-MM-DD). 생략 시 오늘.
          schema:
            type: string
            format: date
            example: "2026-08-03"
      responses:
        '200':
          description: 승인내역 동기화 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMyCardsApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '503':
          $ref: '#/components/responses/CardSyncFailedError'
  /me/card-sort-mode:
    patch:
      tags: [User]
      summary: 홈 보유 카드 정렬 방식 변경
      description: AUTO는 서버 추천 규칙 순서, MANUAL은 사용자가 지정한 카드 순서를 사용합니다.
      operationId: updateMyCardSortMode
      security:
        - MocaBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardSortModeRequest'
      responses:
        '200':
          description: 카드 정렬 방식 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/notification-settings:
    get:
      tags: [User]
      summary: 내 알림 설정 조회
      operationId: getMyNotificationSettings
      security:
        - MocaBearerAuth: []
      responses:
        '200':
          description: 알림 설정 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
    patch:
      tags: [User]
      summary: 내 알림 설정 변경
      operationId: updateMyNotificationSettings
      security:
        - MocaBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsRequest'
      responses:
        '200':
          description: 알림 설정 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
  /me/location-settings:
    get:
      tags: [User]
      summary: 내 위치 추천 설정 조회
      operationId: getMyLocationSettings
      security:
        - MocaBearerAuth: []
      responses:
        '200':
          description: 위치 추천 설정 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSettingsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
    patch:
      tags: [User]
      summary: 내 위치 추천 설정 변경
      operationId: updateMyLocationSettings
      security:
        - MocaBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationSettingsRequest'
      responses:
        '200':
          description: 위치 추천 설정 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSettingsApiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
components:
  securitySchemes:
    MocaBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Google token이 아닌 MOCA 서버 발급 opaque access token을 입력합니다.
  parameters:
    YearMonth:
      name: yearMonth
      in: query
      required: false
      description: 집계 기준 월(미전달 시 Asia/Seoul 현재 월)
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: 2026-07
  responses:
    AuthenticationError:
      description: access token이 없거나 유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthorizationError:
      description: 인증은 완료됐지만 해당 리소스 권한이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 요청값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HomeDataNotFound:
      description: 홈 화면에 표시할 데이터가 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CodefUnavailableError:
      description: >-
        CODEF 상류 타임아웃·연결 실패·비2xx 응답으로 처리하지 못함(재시도 가능, code=CODEF_UNAVAILABLE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CardSyncFailedError:
      description: >-
        승인내역 또는 실적조회 동기화가 실패해 전체 동기화를 중단함. code로 원인을 구분한다.
        APPROVAL_SYNC_FAILED(CODEF 승인내역 조회 실패, 재시도 가능),
        PERFORMANCE_SYNC_FAILED(카드사 실적조회 미지원·조회 가능 범위 초과·CODEF 실적조회 실패 중 하나).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HomeGreetingApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/HomeGreetingResponse'
    HomeGreetingResponse:
      type: object
      required: [nickname, yearMonth, missedBenefitAmount, message]
      properties:
        nickname:
          type: string
        yearMonth:
          type: string
          example: 2026-07
        missedBenefitAmount:
          type: integer
          format: int64
        message:
          type: string
    HomeCardsApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/HomeCardsResponse'
    HomeCardsResponse:
      type: object
      required: [yearMonth, orderMode, cards]
      properties:
        yearMonth:
          type: string
        orderMode:
          type: string
          enum: [AUTO, MANUAL]
        selectedUserCardId:
          type: string
          format: uuid
          nullable: true
        cards:
          type: array
          items:
            $ref: '#/components/schemas/HomeCardResponse'
    HomeCardResponse:
      type: object
      required: [userCardId, order, cardName, alias, cardImageUrl, highlightBenefit, summary]
      properties:
        userCardId:
          type: string
          format: uuid
        order:
          type: integer
        cardName:
          type: string
        alias:
          type: string
          nullable: true
        cardImageUrl:
          type: string
          nullable: true
        autoOrderReason:
          type: string
          nullable: true
        highlightBenefit:
          $ref: '#/components/schemas/HomeBenefitHighlightResponse'
        summary:
          $ref: '#/components/schemas/HomeCardSummaryResponse'
    HomeBenefitHighlightResponse:
      type: object
      properties:
        title:
          type: string
          nullable: true
        monthlyLimitText:
          type: string
          nullable: true
    HomeCardSummaryResponse:
      type: object
      required: [receivedBenefitAmount, availableBenefitAmount, maximumMonthlyBenefitAmount,
                 performanceCurrentAmount, performanceTargetAmount, performanceRate,
                 performanceRemainingAmount]
      properties:
        receivedBenefitAmount:
          type: integer
          format: int64
        availableBenefitAmount:
          type: integer
          format: int64
        maximumMonthlyBenefitAmount:
          type: integer
          format: int64
        performanceCurrentAmount:
          type: integer
          format: int64
        performanceTargetAmount:
          type: integer
          format: int64
        performanceRate:
          type: integer
        performanceRemainingAmount:
          type: integer
          format: int64
    RecentBenefitsApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/RecentBenefitsResponse'
    RecentBenefitsResponse:
      type: object
      required: [benefits]
      properties:
        benefits:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RecentBenefitItemResponse'
    RecentBenefitItemResponse:
      type: object
      required: [benefitHistoryId, merchantName, benefitType, benefitTitle, cardName,
                 paymentAmount, benefitAmount, occurredAt]
      properties:
        benefitHistoryId:
          type: string
        merchantName:
          type: string
        benefitType:
          type: string
          enum: [DISCOUNT, CASHBACK, POINT]
        benefitTitle:
          type: string
        cardName:
          type: string
        paymentAmount:
          type: integer
          format: int64
        benefitAmount:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
    CardLinkApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CardLinkResponse'
    CardLinkResponse:
      type: object
      required: [linkId, institutionCode, status, cards]
      properties:
        linkId:
          type: string
          format: uuid
          description: >-
            이번 연동 한 건(카드사 계정 자격정보, codef_account_credential_id)의 식별자.
            PATCH /card-links/{linkId}/cards의 경로 파라미터로 사용합니다.
        institutionCode:
          type: string
          description: 카드사 기관코드(issuers.institution_code)
          example: "0301"
        status:
          type: string
          enum: [PENDING_CARD_ACTIVATION]
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardLinkCardResponse'
    CardLinkCardResponse:
      type: object
      required: [userCardId, cardName, cardNo, institutionCode, issuerName, cardType, cardImageUrl,
                 matched, supported, optionGroups]
      properties:
        userCardId:
          type: string
          format: uuid
          nullable: true
          description: 매칭 성공 카드만 is_active=false로 적재되어 값이 있고, 미매칭 카드는 null입니다.
        cardId:
          type: string
          format: uuid
          nullable: true
        cardName:
          type: string
        cardNo:
          type: string
          nullable: true
          description: CODEF resCardNo(마스킹된 카드번호, 예 "943646******1069")
          example: "943646******1069"
        institutionCode:
          type: string
          description: 카드사 기관코드(issuers.institution_code)
        issuerName:
          type: string
        cardType:
          type: string
          enum: [CREDIT, CHECK, UNKNOWN]
        cardImageUrl:
          type: string
          nullable: true
          description: 카드고릴라 이미지 → 미매칭 시 CODEF 이미지 순. 둘 다 없으면 null이며 기본 이미지는 프론트가 처리합니다.
        matched:
          type: boolean
        supported:
          type: boolean
          description: false이면 추천 계산에서 제외합니다.
        optionGroups:
          type: array
          items:
            $ref: '#/components/schemas/CardOptionGroupResponse'
    CardOptionGroupResponse:
      type: object
      required: [optionGroupId, groupKey, groupName, choices]
      properties:
        optionGroupId:
          type: string
          format: uuid
        groupKey:
          type: string
        groupName:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/CardOptionChoiceResponse'
    CardOptionChoiceResponse:
      type: object
      required: [optionChoiceId, choiceKey, choiceName]
      properties:
        optionChoiceId:
          type: string
          format: uuid
        choiceKey:
          type: string
        choiceName:
          type: string
    ActivateCardLinkCardsRequest:
      type: object
      required: [activeUserCardIds]
      properties:
        activeUserCardIds:
          type: array
          minItems: 1
          description: 활성화할(이미 적재된) user_card_id 목록
          items:
            type: string
            format: uuid
        optionSelections:
          type: array
          description: 선택형 카드의 옵션 선택. 옵션 없는 카드만 활성화하면 생략 가능합니다.
          items:
            type: object
            required: [userCardId]
            properties:
              userCardId:
                type: string
                format: uuid
              optionSelections:
                type: array
                items:
                  type: object
                  required: [optionGroupId, optionChoiceId]
                  properties:
                    optionGroupId:
                      type: string
                      format: uuid
                    optionChoiceId:
                      type: string
                      format: uuid
    SubmitCardCredentialsRequest:
      type: object
      required: [cardNo]
      properties:
        cardNo:
          type: string
          description: 이 카드의 전체 카드번호. 카드사가 카드번호를 요구할 때만 쓰입니다.
        cardPassword:
          type: string
          description: 카드사 정책상 카드 비밀번호가 필요한 경우에만 필수입니다.
    CardLinkCardApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CardLinkCardResponse'
    SyncOwnedCardsApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SyncOwnedCardsResponse'
    SyncOwnedCardsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOwnedCardsResult'
    SyncOwnedCardsResult:
      type: object
      required: [linkId, institutionCode, success, cards]
      properties:
        linkId:
          type: string
          format: uuid
          description: 이 결과가 속한 연동(codef_account_credential_id)의 식별자
        institutionCode:
          type: string
          example: "0301"
        success:
          type: boolean
          description: false면 CODEF 조회 자체가 실패해 재시도가 필요합니다. cards가 빈 배열인 것과는 다릅니다.
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardLinkCardResponse'
    ActivateCardLinkCardsApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            linkId:
              type: string
              format: uuid
            activatedUserCardIds:
              type: array
              items:
                type: string
                format: uuid
            activatedCount:
              type: integer
    GoogleLoginRequest:
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code:
          type: string
          description: Google callback에서 받은 authorization code
        codeVerifier:
          type: string
          description: PWA가 PKCE 생성 시 보관한 code verifier
        redirectUri:
          type: string
          format: uri
          description: Google 로그인 요청에 사용한 callback URI
    GoogleLoginApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/GoogleLoginResponse'
    GoogleLoginResponse:
      type: object
      properties:
        newMember:
          type: boolean
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          example: 1800
        member:
          $ref: '#/components/schemas/UserProfileResponse'
    RefreshTokenApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/RefreshTokenResponse'
    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          example: 1800
    UserProfileApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfileResponse'
    UserProfileResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        email:
          type: string
          format: email
          nullable: true
        userType:
          type: string
          enum: [user, admin]
        cardSortMode:
          type: string
          enum: [AUTO, MANUAL]
    MeCardsApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/MeCardsResponse'
    MeCardsResponse:
      type: object
      required: [lastSyncedAt, activeCards]
      properties:
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: CODEF 동기화 시각 출처가 연결되기 전에는 null입니다.
        activeCards:
          type: array
          items:
            $ref: '#/components/schemas/MeCardItemResponse'
        inactiveCards:
          type: array
          description: includeInactive=true이면 필드 자체를 생략합니다.
          items:
            $ref: '#/components/schemas/MeCardItemResponse'
    SyncMyCardsApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SyncMyCardsResponse'
    SyncMyCardsResponse:
      type: object
      required: [syncedCardCount, syncedApprovalCount, syncedPerformanceCount, syncedAt]
      properties:
        syncedCardCount:
          type: integer
          description: 동기화 대상 보유 카드 수.
          example: 3
        syncedApprovalCount:
          type: integer
          description: 이번 동기화로 새로 적재된 승인내역 건수.
          example: 42
        syncedPerformanceCount:
          type: integer
          description: 이번 동기화로 upsert된 카드 실적 스냅샷 건수.
          example: 3
        syncedAt:
          type: string
          format: date-time
          description: 동기화 완료 시각(KST 오프셋 포함).
          example: "2026-08-03T10:30:00+09:00"
    MeCardItemResponse:
      type: object
      required: [userCardId, cardName, cardNo, issuerId, issuerName, cardImageUrl, memo]
      properties:
        userCardId:
          type: string
          format: uuid
          example: 01980d6a-5c0c-7aaf-9b85-010203040531
        cardName:
          type: string
          example: KB My WE:SH
        cardNo:
          type: string
          nullable: true
          description: CODEF resCardNo(마스킹된 카드번호)
          example: "943646******1069"
        issuerId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000301
        issuerName:
          type: string
          description: issuer 기준정보에 등록된 확정 카드사명입니다.
          example: KB카드
        cardImageUrl:
          type: string
          nullable: true
          description: 카드 이미지 URL. 없으면 null이며 기본 이미지는 프론트가 처리합니다.
          example: https://example.com/card.png
        memo:
          type: string
          nullable: true
          example: 카페 전용 카드
    UpdateNicknameRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 50
    UpdateCardSortModeRequest:
      type: object
      required: [cardSortMode]
      properties:
        cardSortMode:
          type: string
          enum: [AUTO, MANUAL]
    NotificationSettingsRequest:
      type: object
      required: [performanceClosingEnabled, nearbyBenefitEnabled, benefitLimitEnabled, marketingEnabled]
      properties:
        performanceClosingEnabled:
          type: boolean
        nearbyBenefitEnabled:
          type: boolean
        benefitLimitEnabled:
          type: boolean
        marketingEnabled:
          type: boolean
    NotificationSettingsResponse:
      type: object
      required: [performanceClosingEnabled, nearbyBenefitEnabled, benefitLimitEnabled, marketingEnabled]
      properties:
        performanceClosingEnabled:
          type: boolean
        nearbyBenefitEnabled:
          type: boolean
        benefitLimitEnabled:
          type: boolean
        marketingEnabled:
          type: boolean
    NotificationSettingsApiResponse:
