        data:
          description: 'API의 실제 처리 결과입니다.'
          type: object
          properties:
            linkId:
              description: 활성화 처리를 수행한 카드사 계정 연동 식별자입니다.
              type: string
              format: uuid
            activatedUserCardIds:
              description: 이번 요청에서 활성화된 보유카드 식별자 목록입니다.
              type: array
              items:
                type: string
                format: uuid
            activatedCount:
              description: 이번 요청에서 활성화된 보유카드 수입니다.
              type: integer
    GoogleLoginRequest:
