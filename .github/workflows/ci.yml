name: Backend CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify
        run: ./gradlew check war --no-daemon

      - name: Pre-pull MySQL image for Testcontainers
        run: |
          for attempt in 1 2 3; do
            docker pull mysql:8.0.36 && exit 0
            echo "MySQL 이미지 pull 실패 (${attempt}/3), 10초 후 재시도합니다."
            sleep 10
          done
          exit 1

      - name: Integration test with Testcontainers MySQL
        run: ./gradlew integrationTest --no-daemon
