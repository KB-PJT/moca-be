name: Backend CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moca-production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    environment: DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify and package WAR
        run: ./gradlew clean check war --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            chalie96/moca-be:${{ github.sha }}
            chalie96/moca-be:latest

  deploy:
    needs: build-and-push
    environment: DEPLOYMENT
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      MOCA_IMAGE: chalie96/moca-be:${{ github.sha }}
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS="$(jq -cn --arg image "$MOCA_IMAGE" --arg commit "$GITHUB_SHA" '[
            "set -euo pipefail",
            "sudo -iu ec2-user bash -lc '\''cd /home/ec2-user/moca && curl --fail --silent --show-error --location https://raw.githubusercontent.com/KB-PJT/moca-be/\($commit)/docker-compose.prod.yml --output docker-compose.prod.yml.next && mv docker-compose.prod.yml.next docker-compose.prod.yml && MOCA_IMAGE=\"\($image)\" docker compose -f docker-compose.prod.yml --env-file /home/ec2-user/moca/.env pull && MOCA_IMAGE=\"\($image)\" docker compose -f docker-compose.prod.yml --env-file /home/ec2-user/moca/.env up -d --remove-orphans && curl --fail --retry 10 --retry-delay 3 http://localhost/api/v1/health && docker image prune -f'\''"
          ]')"

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy MOCA ${GITHUB_SHA}" \
            --parameters commands="$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) break ;;
              ""|Pending|InProgress|Delayed) sleep 5 ;;
              *)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
            esac
            if [ "$attempt" -eq 120 ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StandardOutputContent:StandardOutputContent}' \
            --output json
