name: Backend CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moca-production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    environment: DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify and package WAR
        run: ./gradlew clean check war --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            chalie96/moca-be:${{ github.sha }}
            chalie96/moca-be:latest

  deploy:
    needs: build-and-push
    environment: DEPLOYMENT
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      MOCA_IMAGE: chalie96/moca-be:${{ github.sha }}
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_SCRIPT="$(cat <<'SCRIPT'
          set -euo pipefail

          cd /home/ec2-user/moca
          COMPOSE_FILE="docker-compose.prod.yml"
          ROLLBACK_FILE="docker-compose.prod.yml.rollback"
          ENV_FILE="/home/ec2-user/moca/.env"
          PREVIOUS_IMAGE="$(docker inspect --format '{{.Config.Image}}' moca-api 2>/dev/null || true)"

          cp "$COMPOSE_FILE" "$ROLLBACK_FILE"

          wait_for_health() {
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
                  http://127.0.0.1:8080/api/v1/health; then
                return 0
              fi
              echo "health check 대기 중 (${attempt}/60)"
              sleep 5
            done
            echo "health check에 실패했습니다. 컨테이너 상태와 로그를 출력합니다."
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps || true
            docker inspect --format 'container={{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}}' moca-api || true
            docker logs --tail=200 moca-api || true
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=100 moca-api || true
            return 1
          }

          rollback() {
            exit_code=$?
            rollback_failed=0
            if [ "$exit_code" -ne 0 ]; then
              echo "새 릴리스 상태 점검에 실패했습니다. 이전 릴리스로 복구합니다."
              if [ -n "$PREVIOUS_IMAGE" ]; then
                cp "$ROLLBACK_FILE" "$COMPOSE_FILE"
                if ! MOCA_IMAGE="$PREVIOUS_IMAGE" docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --remove-orphans; then
                  echo "이전 릴리스 컨테이너 재기동에 실패했습니다."
                  rollback_failed=1
                elif ! wait_for_health; then
                  echo "이전 릴리스 health check에도 실패했습니다."
                  rollback_failed=1
                fi
              else
                echo "복구할 기존 컨테이너가 없어 롤백을 수행할 수 없습니다."
                rollback_failed=1
              fi
            fi
            rm -f "$ROLLBACK_FILE"
            trap - EXIT
            if [ "$rollback_failed" -ne 0 ]; then
              echo "롤백에 실패했습니다. 수동 복구가 필요합니다."
              exit 1
            fi
            exit "$exit_code"
          }
          trap rollback EXIT

          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/KB-PJT/moca-be/$COMMIT_SHA/docker-compose.prod.yml" \
            --output "$COMPOSE_FILE.next"
          mv "$COMPOSE_FILE.next" "$COMPOSE_FILE"
          MOCA_IMAGE="$MOCA_IMAGE" docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull
          MOCA_IMAGE="$MOCA_IMAGE" docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --remove-orphans
          wait_for_health

          trap - EXIT
          rm -f "$ROLLBACK_FILE"
          docker image prune -af --filter "until=168h"
          SCRIPT
          )"
          SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 --wrap=0)"
          COMMANDS="$(jq -cn --arg script "$SCRIPT_B64" --arg image "$MOCA_IMAGE" --arg commit "$GITHUB_SHA" '[
            "echo \($script) | base64 --decode | sudo -iu ec2-user env MOCA_IMAGE=\"\($image)\" COMMIT_SHA=\"\($commit)\" bash -s"
          ]')"
          PARAMETERS="$(jq -cn --argjson commands "$COMMANDS" '{commands: $commands, executionTimeout: ["600"]}')"

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy MOCA ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 150); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) break ;;
              ""|Pending|InProgress|Delayed) sleep 5 ;;
              *)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
            esac
            if [ "$attempt" -eq 150 ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StandardOutputContent:StandardOutputContent}' \
            --output json
