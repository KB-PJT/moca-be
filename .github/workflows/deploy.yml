name: Backend CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moca-production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify and package WAR
        run: ./gradlew clean check war --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            chalie96/moca-be:${{ github.sha }}
            chalie96/moca-be:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      MOCA_IMAGE: chalie96/moca-be:${{ github.sha }}
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS="$(jq -cn --arg image "$MOCA_IMAGE" --arg commit "$GITHUB_SHA" '[
            "set -euo pipefail",
            "sudo -iu ec2-user bash -lc '\''cd /home/ec2-user/moca && curl --fail --silent --show-error --location https://raw.githubusercontent.com/KB-PJT/moca-be/\($commit)/docker-compose.prod.yml --output docker-compose.prod.yml.next && mv docker-compose.prod.yml.next docker-compose.prod.yml && MOCA_IMAGE=\"\($image)\" docker compose -f docker-compose.prod.yml --env-file /home/ec2-user/moca/.env pull && MOCA_IMAGE=\"\($image)\" docker compose -f docker-compose.prod.yml --env-file /home/ec2-user/moca/.env up -d --remove-orphans && curl --fail --retry 10 --retry-delay 3 http://localhost/api/v1/health && docker image prune -f'\''"
          ]')"

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy MOCA ${GITHUB_SHA}" \
            --parameters commands="$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)"

          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StandardOutputContent:StandardOutputContent}' \
            --output json
