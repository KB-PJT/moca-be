name: 작업 이슈
description: 부모 이슈에 속하는 하나의 구현 작업을 정의합니다.
labels:
  - task

body:
  - type: markdown
    attributes:
      value: |
        ## 📌 작업 이슈 작성 가이드

        하나의 브랜치와 하나의 Pull Request로 완료할 수 있는 작업 단위로 작성해주세요.

  - type: input
    id: parent
    attributes:
      label: 🔗 부모 이슈
      description: 이 작업이 속한 부모 이슈 번호를 작성해주세요.
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 📌 작업 요약
      description: 구현할 작업을 한 문장으로 작성해주세요.
      placeholder: |
        예)
        OAuth 로그인 API를 구현한다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 📂 작업 내용
      description: 이번 작업에서 구현할 내용을 작성해주세요.
      placeholder: |
        - OAuth 로그인 API 구현
        - 서버 관리형 opaque access token 및 refresh token 발급
        - 로그인 성공 처리
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ 완료 조건
      description: 작업이 완료되었다고 판단하는 기준을 작성해주세요.
      placeholder: |
        - [ ] OAuth 로그인이 정상 동작한다.
        - [ ] opaque token이 정상 발급된다.
        - [ ] 테스트를 완료했다.
    validations:
      required: true

  - type: textarea
    id: consideration
    attributes:
      label: ⚠️ 고려 사항
      description: 구현 전 논의하거나 결정해야 할 사항이 있다면 작성해주세요. (선택)
      placeholder: |
        - Access Token 및 Refresh Token 만료 시간 결정
        - Refresh Token 저장 방식

  - type: textarea
    id: reference
    attributes:
      label: 📖 참고 자료
      description: 관련 문서나 링크가 있다면 작성해주세요. (선택)
      placeholder: |
        - API 명세
        - ERD
        - Figma
        - Notion
        - 공식 문서
