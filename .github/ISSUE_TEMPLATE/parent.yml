name: 부모 이슈
description: 여러 자식 이슈로 분리될 기능의 목표와 범위를 정의합니다.
labels:
  - parent

body:
  - type: markdown
    attributes:
      value: |
        ## 📌 부모 이슈 작성 가이드

        부모 이슈는 **하나의 기능을 정의하는 이슈**입니다.

        - 구현 세부사항보다 기능의 목표와 범위를 작성합니다.
        - 실제 구현은 자식 이슈(Task)로 분리하여 진행합니다.
        - 부모 이슈는 모든 자식 이슈가 완료되면 종료합니다.

  - type: textarea
    id: summary
    attributes:
      label: 📌 기능 요약
      description: 구현할 기능을 한 문장으로 작성해주세요.
      placeholder: |
        예)
        사용자가 OAuth를 통해 로그인할 수 있도록 인증 기능을 제공한다.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 🎯 배경 및 목적
      description: 현재 문제와 이 기능이 필요한 이유를 작성해주세요.
      placeholder: |
        - 현재 문제
        - 해결하려는 내용
        - 사용자에게 제공할 가치
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 📂 구현 범위
      description: 이번 부모 이슈에서 구현할 기능을 작성해주세요.
      placeholder: |
        - OAuth 로그인
        - 자체 불투명 Access Token 및 Refresh Token 발급
        - 로그인 성공 처리
        - 최초 회원가입 처리
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ 완료 조건
      description: 부모 이슈가 완료되었다고 판단하는 기준을 작성해주세요.
      placeholder: |
        - [ ] 모든 자식 이슈가 완료되었다.
        - [ ] 기능이 정상 동작한다.
        - [ ] 테스트를 완료했다.
    validations:
      required: true

  - type: textarea
    id: consideration
    attributes:
      label: ⚠️ 고려 사항
      description: 구현 전 논의하거나 결정해야 할 사항이 있다면 작성해주세요. (선택)
      placeholder: |
        - Access Token 및 Refresh Token 만료 시간 결정
        - Refresh Token 저장 방식

  - type: textarea
    id: reference
    attributes:
      label: 📖 참고 자료
      description: 관련 문서나 링크가 있다면 작성해주세요. (선택)
      placeholder: |
        - API 명세
        - ERD
        - Figma
        - Notion
        - 공식 문서
